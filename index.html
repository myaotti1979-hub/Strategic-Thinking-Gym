tent:center;border-radius:6px;flex-shrink:0;margin-top:1px;color:#bab7ae}.ob.sl .ol{color:#d4a853;background:#2a2410}.ob.rv.co .ol{color:#6ec992;background:#1a3026}.ob.rv.wr .ol{color:#e07a73;background:#2a1210}.oti{font-size:14px;font-weight:700;margin-bottom:3px;color:#c0bdb4}.ob.sl .oti{color:#e8e4d9}.ob.rv.co .oti{color:#6ec992}.ob.rv.wr .oti{color:#e07a73}.ob.rv.fd .oti{color:#9a968e}.ode{color:#7a776e;font-size:12px;line-height:1.5}.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:15px;font-weight:800;font-family:inherit;letter-spacing:.5px;transition:all .3s}.bg{background:#d4a853;color:#0a0a0a;cursor:pointer}.bl{background:#e8e4d9;color:#0a0a0a;cursor:pointer;margin-top:16px}.bo{background:#2a2a28;color:#9a968e;cursor:default}.ex{background:#141413;border:1px solid #2a2a28;border-radius:16px;padding:24px 20px;margin-top:16px}.sl2{color:#a8a49c;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}.st2{color:#c0bdb4;font-size:14px;line-height:1.8}.fb{background:#1a1810;border:1px solid #3a3520;border-radius:12px;padding:16px 18px;margin:16px 0}.fb .sl2{color:#d4a853}.fb .st2{font-size:13px;line-height:1.75}.eb{background:#0f1714;border:1px solid #1a3526;border-radius:12px;padding:16px 18px}.eb .sl2{color:#4a9e6e}.eb .st2{color:#a0b8a8;font-size:13px;line-height:1.75}.sb{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.si{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#141413;border-radius:10px}.si.sc{border:1px solid #1a3526}.si.sw{border:1px solid #2a1a18}.ft{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.fb2{padding:6px 12px;background:#141413;border:1.5px solid #2a2a28;border-radius:8px;cursor:pointer;font-family:inherit;color:#a8a49c;font-size:11px;font-weight:700;transition:all .2s}.fb2:hover{border-color:#4a4a45;color:#c0bdb4}.fb2.ac{border-color:#d4a853;color:#d4a853;background:#1a1710}.fb2.acg{border-color:#6ec992;color:#6ec992;background:#0f1a14}.sel2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.sel2 label{display:flex;align-items:center;gap:6px;font-size:12px;color:#bab7ae;cursor:pointer}.sel2 input{accent-color:#d4a853}.fade-in{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

<script>
// === Security: HTML escape helper ===
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

// === Constants ===
const JPY_RATE = 152; // 円/ドル概算レート（設定画面で変更可能にする予定）
const DAILY_GOAL_DEFAULT = 5; // デフォルト日次目標

// CASES is loaded via <script src="cases.js" defer>
// Wait for it to be available before rendering
let GEMINI_CASES = [];
function waitForCases(){
  if(typeof CASES!=='undefined'&&Array.isArray(CASES)&&CASES.length>0){
    console.log('✓ '+CASES.length+'問読み込み完了');
    buildCompIds();
    try{var gq=JSON.parse(localStorage.getItem('gemini_questions')||'[]');if(gq.length>0){GEMINI_CASES=gq;}}catch(e){}
    render();
  }else{
    // Wait a bit and retry, up to 15 seconds
    if(!window._casesRetry)window._casesRetry=0;
    window._casesRetry++;
    if(window._casesRetry<60){
      setTimeout(waitForCases,250);
    }else{
      document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:#e8e4d9"><h2>問題データの読み込みに失敗</h2><p style="color:#bab7ae;margin-top:12px">cases.jsが見つからないかネットワークエラーです。</p><button onclick="location.reload()" style="margin-top:20px;padding:12px 24px;background:#5b8fb9;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer">再読み込み</button></div>';
      var sp=document.getElementById('splash');if(sp){sp.classList.add('hide');}
    }
  }
}



const FW_MKT=['PESTLE分析','5フォース分析','SWOT分析','クロスSWOT分析','アンゾフの成長マトリクス','STP分析','4P/4C分析'];
const FW_GRW=['グロースモデル選択','KPI設計','実行戦略パターン'];
const FW=[...FW_MKT,...FW_GRW];

// COMP_IDS: auto-generated from CASES after load
let COMP_IDS={};
function buildCompIds(){
  // Group by company name, find companies with 5+ questions
  const groups={};
  CASES.forEach(c=>{
    // Extract company name (e.g. "ベルソワン社" from industry)
    const m=c.industry.match(/^(.+?社|.+?銀行)/);
    if(!m)return;
    const name=m[1];
    if(!groups[name])groups[name]={ids:[],diffs:{}};
    groups[name].ids.push(c.id);
    groups[name].diffs[c.difficulty]=(groups[name].diffs[c.difficulty]||0)+1;
  });
  COMP_IDS={};
  Object.entries(groups).forEach(([name,data])=>{
    if(data.ids.length<5)return;
    // Determine primary difficulty by majority
    const d=data.diffs;
    const primary=(d['上級']||0)>=(d['中級']||0)&&(d['上級']||0)>=(d['初級']||0)?'上級':
                  (d['中級']||0)>=(d['初級']||0)?'中級':'初級';
    const emoji=primary==='上級'?'🔴':primary==='中級'?'🟡':'🟢';
    COMP_IDS[emoji+' '+name]=data.ids.sort((a,b)=>a-b);
  });
}

let aFw='all',mode='individual',compTarget=null,total=5,quiz=[],idx=0,sel=null,rev=false,results={},screen='start';
let questionSource='claude';
let onlyUnanswered=false;
window.aDiff='all';
let answerHistory={};
try{answerHistory=JSON.parse(localStorage.getItem('answer_history')||'{}');}catch(e){}

// === Answer date tracking ===
let answerDates={};
try{answerDates=JSON.parse(localStorage.getItem('answer_dates')||'{}');}catch(e){}

function saveAnswer(id,correct){
  answerHistory[id]=correct?'correct':'wrong';
  try{localStorage.setItem('answer_history',JSON.stringify(answerHistory));}catch(e){}
  answerDates[id]=Date.now();
  try{localStorage.setItem('answer_dates',JSON.stringify(answerDates));}catch(e){}
  updateSRS(id,correct);
}

// === Learning goal ===
let dailyGoal=DAILY_GOAL_DEFAULT;
try{dailyGoal=parseInt(localStorage.getItem('daily_goal'))||DAILY_GOAL_DEFAULT;}catch(e){}

// === Spaced Repetition data ===
// srsData[id] = { nextReview: timestamp, interval: days, easeFactor: 2.5 }
let srsData={};
try{srsData=JSON.parse(localStorage.getItem('srs_data')||'{}');}catch(e){}
function updateSRS(id,correct){
  const d=srsData[id]||{interval:1,easeFactor:2.5};
  if(correct){
    d.interval=Math.round(d.interval*d.easeFactor);
    d.easeFactor=Math.min(3.0,d.easeFactor+0.1);
  }else{
    d.interval=1;
    d.easeFactor=Math.max(1.3,d.easeFactor-0.2);
  }
  d.nextReview=Date.now()+d.interval*86400000;
  srsData[id]=d;
  try{localStorage.setItem('srs_data',JSON.stringify(srsData));}catch(e){}
}

// === Search state ===
let searchQuery='';
let searchResults=[];

let _clearing=false;async function clearHistory(){_clearing=true;answerHistory={};answerDates={};srsData={};try{localStorage.removeItem('answer_history');localStorage.removeItem('answer_dates');localStorage.removeItem('srs_data');}catch(e){}if(typeof syncUrl!=='undefined'&&syncUrl&&typeof syncId!=='undefined'&&syncId){try{const url=syncUrl.replace(/\/$/,'')+'/'+encodeURIComponent(syncId)+'.json';await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({h:{},t:Date.now()})});}catch(e){}}render();setTimeout(()=>{_clearing=false;},3000);}
let gemKey='';let gemKeyFree='';
let gemModel='flash35';
let chatMaxTurns=3;
let sessionCost=0;
let monthlyCost=0;
try{gemModel=localStorage.getItem('gemini_model')||'flash35';}catch(e){}
try{monthlyCost=parseFloat(localStorage.getItem('monthly_cost_'+new Date().toISOString().slice(0,7))||'0');}catch(e){}
const MODEL_INFO={
  flash35:{name:'3.5 Flash',icon:'🔥',api:'gemini-3.5-flash',inCost:0,outCost:0,thinkMult:0,desc:'推奨・無料枠'},
  flash:{name:'2.5 Flash',icon:'⚡',api:'gemini-2.5-flash',inCost:0,outCost:0,thinkMult:0,desc:'旧世代Flash'},
  flashlite:{name:'3.1 Flash-Lite',icon:'⚡',api:'gemini-3.1-flash-lite',inCost:0,outCost:0,thinkMult:0,desc:'最速・最軽量'},
  pro25:{name:'2.5 Pro',icon:'💎',api:'gemini-2.5-pro',inCost:1.25,outCost:10.00,thinkMult:2.5,desc:'有料・高品質'},
  pro31:{name:'3.1 Pro',icon:'◆',api:'gemini-3.1-pro-preview',inCost:2.00,outCost:12.00,thinkMult:3,desc:'有料・最高品質'}
};
function estTurnCost(m){const i=MODEL_INFO[m];const inT=1800,outT=1500,thT=outT*i.thinkMult;return((inT*i.inCost+(outT+thT)*i.outCost)/1000000*JPY_RATE).toFixed(1);}
function estCostFromChars(inChars,outChars,m){const i=MODEL_INFO[m];const inT=Math.ceil(inChars/1.5),outT=Math.ceil(outChars/1.5),thT=outT*i.thinkMult;return(inT*i.inCost+(outT+thT)*i.outCost)/1000000*JPY_RATE;}
function addCost(c){sessionCost+=c;monthlyCost+=c;try{localStorage.setItem('monthly_cost_'+new Date().toISOString().slice(0,7),monthlyCost.toFixed(2));}catch(e){}}
try{gemKey=localStorage.getItem('gemini_key')||'';gemKeyFree=localStorage.getItem('gemini_key_free')||'';}catch(e){}
function getApiKey(model){if(model==='flash35'||model==='flash'||model==='flashlite')return gemKeyFree||gemKey;return gemKey;}
let chatHist=[],chatLoading=false,chatTurns=0;
let onlyWrong=false;
let onlySrsDue=false;
let bookmarks={};
try{bookmarks=JSON.parse(localStorage.getItem('bookmarks')||'{}');}catch(e){}
let darkMode=false;
try{darkMode=localStorage.getItem('dark_mode')==='false'?false:true;}catch(e){darkMode=true;}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function pool(){
  if(mode==='comp'&&compTarget) return CASES.filter(c=>COMP_IDS[compTarget]?.includes(c.id));
  let src=questionSource==='gemini'?GEMINI_CASES:CASES;
  let p=src.filter(c=>!c.industry?.includes('総合'));
  if(aFw!=='all') p=p.filter(c=>c.framework===aFw);
  if(window.aDiff&&window.aDiff!=='all') p=p.filter(c=>c.difficulty===window.aDiff);
  if(onlyUnanswered) p=p.filter(c=>!answerHistory[c.id]);
  if(onlyWrong) p=p.filter(c=>answerHistory[c.id]==='wrong');
  if(window.onlyBookmarked) p=p.filter(c=>bookmarks[c.id]);
  if(onlySrsDue) p=p.filter(c=>{const s=srsData[c.id];return s&&s.nextReview&&s.nextReview<=Date.now();});
  return p;
}
function start(){
  const p=pool();
  if(mode==='comp'){quiz=[...p].sort((a,b)=>a.id-b.id);total=quiz.length;}
  else{total=Math.min(parseInt(document.getElementById('qnum')?.value||10),p.length);quiz=shuffle(p).slice(0,total);}
  idx=0;sel=null;rev=false;results={};chatHist=[];chatTurns=0;screen='quiz';

  if(quiz.length>0)tryRestoreSparring(quiz[0].id);

}
function goHome(){
  // Save sparring state if mid-conversation
  if(screen==='quiz'&&chatHist.length>0&&chatTurns<chatMaxTurns){
    try{
      const c=quiz[idx];
      localStorage.setItem('sparring_draft',JSON.stringify({caseId:c.id,chatHist,chatTurns,savedAt:Date.now()}));
    }catch(e){}
  }
  screen='start';chatHist=[];chatTurns=0;render();window.scrollTo({top:0});
}
// Restore sparring draft if available for current question
function tryRestoreSparring(caseId){
  try{
    const draft=JSON.parse(localStorage.getItem('sparring_draft')||'null');
    if(draft&&draft.caseId===caseId&&(Date.now()-draft.savedAt)<86400000){
      chatHist=draft.chatHist;chatTurns=draft.chatTurns;
      localStorage.removeItem('sparring_draft');
      return true;
    }
  }catch(e){}
  return false;
}

async function sendChat(){
  try{
    const activeModel=(quiz[idx]&&quiz[idx].difficulty==='初級')?'flashlite':gemModel;
    const input=document.getElementById('chatInput');
    if(!input||!input.value.trim()||chatLoading||chatTurns>=chatMaxTurns)return;
    const userMsg=input.value.trim();
    input.value='';
    chatHist.push({role:'user',content:userMsg});
    chatTurns++;
    chatLoading=true;
    render();
    const c=quiz[idx];
    const userAns=c.options.find(o=>o.id===sel);
    const correctAns=c.options.find(o=>o.id===c.bestAnswer);
    const isLastTurn=chatTurns>=chatMaxTurns;
    const _wp=getTopWeaknessPattern();
    const _weaknessLine=_wp?'\n- 【コーチング指示】このユーザーの過去の傾向：「'+_wp.pattern+'」（'+_wp.count+'/'+_wp.total+'回の壁打ちで確認）。今回の'+c.framework+'の文脈でこの傾向に関連する視点があれば、議論の中で自然に深掘りしてください。直接弱点を指摘せず問いかけで気づかせること。':'';
    const sysPrompt=`あなたは事業戦略の専門家です。以下のケースについてユーザーと壁打ち（戦略議論）をしてください。
【ケース】${c.situation}
【問い】${c.question}
【ユーザーの回答】${userAns?userAns.label:'未選択'}
【正解】${correctAns?correctAns.label:''}
【解説】${c.explanation}
【フレームワーク】${c.framework}

ルール：
- 日本語で回答
- 400-600文字程度で丁寧に回答
- ユーザーの視点を尊重しつつ、戦略的な深い議論を
- 反論や別の視点も積極的に提示
- 実在企業の事例を交えて具体的に
${_weaknessLine}
${isLastTurn?'- 【重要】これが最後のターンです。新しい質問は投げかけず、これまでの議論を総括してください。ユーザーの戦略的思考の良かった点を具体的に挙げ、今後の学びのポイントをまとめて締めくくってください。':'- 回答の最後に、議論を深めるための問いかけを1つ入れてください。'}`;
    const messages=[{role:'user',parts:[{text:sysPrompt}]},{role:'model',parts:[{text:'承知しました。このケースについて議論しましょう。'}]}];
    chatHist.forEach(m=>{messages.push({role:m.role==='user'?'user':'model',parts:[{text:m.content}]});});
    const controller=new AbortController();
    const tid=setTimeout(()=>controller.abort(),30000);
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_INFO[activeModel||gemModel].api}:generateContent?key=${getApiKey(activeModel||gemModel)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:messages,generationConfig:{maxOutputTokens:16000,temperature:0.7}}),
      signal:controller.signal
    });
    clearTimeout(tid);
    const data=await res.json();
    if(data.candidates&&data.candidates[0]){
      const text=data.candidates[0].content.parts.map(p=>p.text||'').join('');
      chatHist.push({role:'model',content:text});
      const inChars=JSON.stringify(messages).length;
      const outChars=text.length;
      addCost(estCostFromChars(inChars,outChars,activeModel||gemModel));
    }else{
      chatTurns--;chatHist.pop();chatHist.push({role:'model',content:'⚠️ APIエラー: '+(data.error?.message||'応答を取得できませんでした')+'（ターン消費なし。再送信してください）'});
    }
  }catch(e){
    chatTurns--;chatHist.pop();chatHist.push({role:'model',content:'⚠️ '+(e.name==='AbortError'?'タイムアウト（30秒）':'エラー: '+e.message)+'（ターン消費なし。再送信してください）'});
  }finally{
    chatLoading=false;
    try{if(chatTurns>=chatMaxTurns){const _ss=saveSparringSession();if(_ss)generateReviewCard(_ss.id);}}catch(se){console.error('save error:',se);}
    render();
    setTimeout(()=>{const ci=document.getElementById('chatInput');if(ci)ci.focus();},100);
  }
}


function rDashboard(){
  const fws=['PESTLE分析','5フォース分析','SWOT分析','クロスSWOT分析','アンゾフの成長マトリクス','STP分析','4P/4C分析','グロースモデル選択','KPI設計','実行戦略パターン'];
  const fwShort=['PESTLE','5F','SWOT','CrossSWOT','Ansoff','STP','4P/4C','Growth','KPI','Exec'];
  const diffs=['初級','中級','上級'];
  
  // Calculate stats per FW
  const fwStats=fws.map((fw,i)=>{
    const qs=CASES.filter(c=>c.framework===fw);
    const answered=qs.filter(c=>answerHistory[c.id]);
    const correct=qs.filter(c=>answerHistory[c.id]==='correct');
    return{name:fwShort[i],fullName:fw,total:qs.length,answered:answered.length,correct:correct.length,rate:answered.length>0?Math.round(correct.length/answered.length*100):null};
  });
  
  // Calculate stats per difficulty
  const diffStats=diffs.map(d=>{
    const qs=CASES.filter(c=>c.difficulty===d);
    const answered=qs.filter(c=>answerHistory[c.id]);
    const correct=qs.filter(c=>answerHistory[c.id]==='correct');
    return{name:d,total:qs.length,answered:answered.length,correct:correct.length,rate:answered.length>0?Math.round(correct.length/answered.length*100):null};
  });
  
  // Overall stats
  const totalAnswered=Object.keys(answerHistory).length;
  const totalCorrect=Object.values(answerHistory).filter(v=>v==='correct').length;
  const overallRate=totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0;
  
  // Radar chart SVG
  const cx=150,cy=150,r=110;
  const n=fwStats.length;
  const points=fwStats.map((fw,i)=>{
    const angle=(Math.PI*2*i/n)-Math.PI/2;
    const val=fw.rate!==null?fw.rate/100:0;
    return{x:cx+r*val*Math.cos(angle),y:cy+r*val*Math.sin(angle),lx:cx+(r+25)*Math.cos(angle),ly:cy+(r+25)*Math.sin(angle),name:fw.name,rate:fw.rate};
  });
  
  const gridLines=[0.25,0.5,0.75,1.0].map(scale=>{

      const angle=(Math.PI*2*i/n)-Math.PI/2;
      return`${cx+r*scale*Math.cos(angle)},${cy+r*scale*Math.sin(angle)}`;
    });
    return`<polygon points="${pts.join(' ')}" fill="none" stroke="#2a2a28" stroke-width="0.5"/>`;
  }).join('');
  
  const axisLines=Array.from({length:n},(_,i)=>{
    const angle=(Math.PI*2*i/n)-Math.PI/2;
    return`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(angle)}" y2="${cy+r*Math.sin(angle)}" stroke="#2a2a28" stroke-width="0.5"/>`;
  }).join('');
  
  const dataPolygon=points.filter(p=>p.rate!==null).length>=3?
    `<polygon points="${points.map(p=>p.rate!==null?`${p.x},${p.y}`:`${cx},${cy}`).join(' ')}" fill="rgba(91,143,185,0.25)" stroke="#5b8fb9" stroke-width="2"/>`:

    }()}
    ${function(){
      // Time series graph (B4)
      const weeks=getWeeklyStats(8);
      if(weeks.every(w=>w.total===0))return'';
      const maxTotal=Math.max(...weeks.map(w=>w.total),1);
      const w2=260,h2=120,pad=30;
      const barW=(w2-pad*2)/weeks.length*0.7;
      const gap=(w2-pad*2)/weeks.length;
      let bars='';
      weeks.forEach((wk,i)=>{
        const x=pad+i*gap+gap*0.15;
        const barH=wk.total>0?(wk.total/maxTotal)*(h2-pad-10):0;
        const rateH=wk.rate!==null?(wk.correct/maxTotal)*(h2-pad-10):0;
        bars+=`<rect x="${x}" y="${h2-pad-barH}" width="${barW}" height="${barH}" fill="#2a2a28" rx="2"/>`;
        if(rateH>0)bars+=`<rect x="${x}" y="${h2-pad-rateH}" width="${barW}" height="${rateH}" fill="${wk.rate>=70?'#4a9e6e':wk.rate>=40?'#d4a853':'#c4554e'}" rx="2"/>`;
        bars+=`<text x="${x+barW/2}" y="${h2-8}" text-anchor="middle" fill="#6b6860" font-size="8">${wk.label}</text>`;
        if(wk.rate!==null)bars+=`<text x="${x+barW/2}" y="${h2-pad-barH-4}" text-anchor="middle" fill="#a09d93" font-size="7">${wk.rate}%</text>`;
      });
      return '<div style="margin-top:16px;padding:16px;background:#0f0f0e;border-radius:12px">'
        +'<div style="font-size:12px;font-weight:700;color:#bab7ae;margin-bottom:8px">📈 週別正答率推移</div>'
        +'<svg viewBox="0 0 '+w2+' '+h2+'" style="width:100%">'+bars+'</svg>'

        +'</div>';
    }()}
  </div>`;
}

function exportCases(){
  const blob=new Blob([JSON.stringify(CASES,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='stgym_cases_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
}

function importCases(input){
  const file=input.files[0];
  if(!file)return;
  const status=document.getElementById('importStatus');
  status.textContent='読み込み中...';status.style.color='#d4a853';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)){throw new Error('配列形式ではありません');}
      if(data.length===0){throw new Error('問題が0件です');}
      const sample=data[0];
      if(!sample.id||!sample.options||!sample.bestAnswer){throw new Error('問題データの形式が不正です');}
      if(!confirm(data.length+'問のデータをインポートします。現在の'+CASES.length+'問は上書きされます。よろしいですか？'))return;
      CASES=data;
      // Save to cache via fetch replacement
      const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
      caches.open('stgym-v72').then(cache=>{
        cache.put(new Request('./cases.json'),new Response(blob));
      });
      status.textContent='✓ '+data.length+'問をインポートしました';status.style.color='#4a9e6e';
      setTimeout(()=>render(),1500);
    }catch(err){
      status.textContent='✗ エラー: '+err.message;status.style.color='#c4554e';
    }
  };
  reader.readAsText(file);
  input.value='';
}

function exportHistory(){

  const url=URL.createObjectURL(blob);

  a.href=url;a.download='stgym_history_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
}

function importHistory(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(typeof data!=='object'){throw new Error('形式が不正です');}
      const count=Object.keys(data).length;
      if(!confirm(count+'件の回答履歴をインポートします。現在の履歴とマージされます。'))return;
      Object.assign(answerHistory,data);
      try{localStorage.setItem('answer_history',JSON.stringify(answerHistory));}catch(ex){}
      alert('✓ '+count+'件の履歴をインポートしました');
      render();
    }catch(err){alert('エラー: '+err.message);}
  };
  reader.readAsText(file);
  input.value='';
}

  result.innerHTML='<div style="padding:16px"><div id="cqProgress" style="font-size:12px;color:#d4a853;line-height:2">⏳ Gemini に接続中...</div></div>';
  
  const _fwGuide={
'PESTLE分析':'選択肢は全て外部環境の「要因」を記述。戦略や自社リソースとの適合は書かない。正答の選定基準は「その外部要因が事業継続・成長に与えるインパクトの大きさ」であり「自社技術との相性」ではない。解説では次のFW（SWOT等）に繋がる示唆を含めること。P/E/S/T/L/Eの各領域から選択肢を出すこと。',
'5フォース分析':'選択肢は「脅威」や「競争構造の変化」を記述。対抗策や自社戦略は書かない。正答の選定基準は「脅威のインパクト×発生確率」であり「自社の対応力」ではない。5つの力（新規参入・代替品・買い手・売り手・業界内競争）から選択肢を出すこと。',
'SWOT分析':'選択肢は「戦略の方向性」を記述。',
'クロスSWOT分析':'SO/WO/ST/WTの戦略を記述するがSO:等の接頭辞は禁止。',
'アンゾフの成長マトリクス':'市場浸透/新製品開発等の戦略を記述するが接頭辞は禁止。',
'STP分析':'ターゲットセグメントとポジショニングの組合せを記述。',
'4P/4C分析':'各選択肢が異なるP（Product/Price/Place/Promotion）の組合せを提案すること。全選択肢がProductだけにならないように。',
'グロースモデル選択':'PLG/SLG等のモデル名の接頭辞は禁止。中身を平易に記述。',
'KPI設計':'選択肢はKPI指標を記述。戦略文は書かない。',
'実行戦略パターン':'具体的な実行施策を記述。'
  };
  const _diffGuide=diff==='初級'?'正解が明確。不正解は惜しいが筋が悪いレベル。':diff==='中級'?'2つで迷うレベル。不正解も別文脈なら正解。':'全選択肢がもっともらしく全てにデータ裏付けがある。一見最良に見える罠の選択肢を含む。正答は因果の連鎖で導く。消去法では解けない。';
  
  const prompt='あなたは事業戦略クイズの問題作成の専門家です。以下の絶対ルールを厳守し4択問題を1問作成してください。\n\n'
    +'【業種・企業】'+industry+'\n【フレームワーク】'+fw+'\n【難易度】'+diff+'\n\n'
    +'■ 選択肢label（最重要）\n'
    +'- 全4選択肢のlabelを15〜40文字で揃えること\n'
    +'- 正答だけが長い/詳しいのは絶対禁止\n'
    +'- FW用語の接頭辞（SO:,WO:,Product:,PLG:等）は絶対禁止\n'
    +'- テンプレ表現（この方向性で〜、経営資源を集中〜）は禁止\n'
    +'- 助詞で文が終わってはならない\n'
    +'- '+(_fwGuide[fw]||'')+'\n\n'
    +'■ description: 各選択肢に20文字以上の詳細説明\n'
    +'■ situation: 100〜200文字で具体的数値を含める\n'
    +'■ explanation: bestAnswerが最適な理由＋他3つがなぜ不適切かを説明\n'
    +'■ 難易度: '+_diffGuide+'\n'
    +'■ bestAnswer: この問題では正答を必ず「'+'abcd'[GEMINI_CASES.length%4]+'」にすること（指定ポジション）\n\n'
    +'■ 戦略の実現可能性（最重要）\n'
    +'- 正答は企業の経営状況（資金力・人材・ノウハウ）で実現可能なものにすること\n'
    +'- 赤字企業に大規模投資を要する戦略を正答にしない\n'
    +'- 「強みを新市場に転用」は具体的な根拠（既存チャネル、技術的優位性の具体的裏付け）がなければ正答にしない\n'
    +'- 安直なSO戦略（強み×機会に飛びつくだけ）を正答にしない。実行面のハードル（資金、人材、時間）を考慮すること\n'
    +'- 不正解の選択肢にも一定の合理性を持たせ、正答が「消去法でしか選べない」レベルにすること\n'
    +'- 設問文で戦略の方向性を示唆しないこと（「強みを活かし機会を捉える」等のヒントを問題文に書かない）\n'
    +'- 状況文に「○○を検討している」と書いた内容をそのまま正答にしない（状況文がヒントになる）\n'
    +'- 不正解3つのうち少なくとも1つは「一見正しそうだが致命的な見落としがある」レベルにすること\n'
    +'■ 数値の整合性（必須）\n'
    +'- 状況文に含む数字（売上・拠点数・従業員数・利益率・単価等）が相互に矛盾しないこと\n'
    +'- 売上÷拠点数＝1拠点売上、売上÷従業員数＝1人あたり売上、等を概算し現実的か検算すること\n'
    +'- その業界の一般的なコスト構造（人件費率・原材料費率・固定費率）を考慮し、提示した利益率が成立するか確認すること\n'
    +'- 企業規模の表現（中小/中堅/大手）が売上・従業員数・拠点数と整合すること\n'
    +'■ 上級問題の構造設計（難易度が上級の場合は必須）\n'
    +'- 全選択肢に具体的な数値データ（率、額、期間等）を含めること\n'
    +'- 一見最良に見える選択肢に「短期では有効だが長期で崩壊する」等の構造的な罠を設定すること\n'
    +'- 正答は「地味だが因果の連鎖を辿ると最も効果が高い」タイプにすること\n'
    +'- 消去法では解けない設計にすること（全選択肢にもっともらしいデータ裏付けをつける）\n'
    +'- KPI問題では先行指標vs遅行指標、短期vs長期、相関vs因果の区別が問われる設計にすること\n'
    +'- 解説では「なぜ一見良さそうな選択肢が不適切か」を因果関係で説明すること\n\n'
    +'■ 自己反論テスト（生成後に内部で実行）\n'
    +'- 問題を作成した後、各不正解に対し「この選択肢が実は正答より優れている」という反論を試みること\n'
    +'- 反論が成立する場合、状況文・解説・選択肢を修正して反論が成立しないようにすること\n'
    +'- 特にOEM/受託の原材料費負担、市場規模と参入可能性、資金制約と投資規模の整合を検証すること\n'
    +'- 全不正解に対して反論が成立しないことを確認してから出力すること\n\n'
    +'以下のJSONのみ出力。JSON以外は一切出力しないこと。\n'
    +'{"industry":"業種名","situation":"状況文","question":"設問文","options":[{"id":"a","label":"選択肢A","description":"詳細A"},{"id":"b","label":"選択肢B","description":"詳細B"},{"id":"c","label":"選択肢C","description":"詳細C"},{"id":"d","label":"選択肢D","description":"詳細D"}],"bestAnswer":"正答id","explanation":"解説文","keyFramework":"FW適用ポイント","realExample":"実在企業の類似事例"}';

  try{
    // 3.1 Proで最大3回リトライ（503対策）
    var data=null;
    for(var _retry=0;_retry<3;_retry++){
      if(_retry>0){
        var pg2=document.getElementById('cqProgress');
        if(pg2){pg2.innerHTML='<div style="color:#d4a853">⚠️ 503エラー → '+(_retry+1)+'回目のリトライ（5秒後）...</div>';}
        await new Promise(r=>setTimeout(r,5000));
      }
      try{
        var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(MODEL_INFO[document.getElementById('cqModelVal')?.value||'pro31']||MODEL_INFO.pro31).api+':generateContent?key='+getApiKey('pro31'),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:8192,temperature:0.7}})
        });
        if(res.status===503){continue;}
        data=await res.json();
        if(data.candidates&&data.candidates[0])break;
      }catch(e){continue;}
    }
    if(!data||!data.candidates||!data.candidates[0]){var _errMsg='3.1 Pro エラー';
    try{if(data&&data.error)_errMsg+=': '+JSON.stringify(data.error).substring(0,200);}catch(x){}
    if(res&&res.status)_errMsg+=' (HTTP '+res.status+')';
    throw new Error(_errMsg);}
    
    var text=data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    text=text.replace(/```json|```/g,'').trim();
    
    // JSON修復: 途切れている場合の補完
    if(!text.endsWith('}')){
      var lastBrace=text.lastIndexOf('}');
      if(lastBrace>0) text=text.substring(0,lastBrace+1);
      // 未閉じの文字列を閉じる
      var openQuotes=(text.match(/"/g)||[]).length;
      if(openQuotes%2!==0) text+='"';
      // 未閉じの配列・オブジェクトを閉じる
      var opens=0,closes=0;
      for(var ci=0;ci<text.length;ci++){if(text[ci]==='{')opens++;if(text[ci]==='}')closes++;}
      while(closes<opens){text+='}';closes++;}
    }
    var q;
    try{q=JSON.parse(text);}catch(pe){throw new Error('JSON解析エラー。再生成してください: '+pe.message.substring(0,50));}
    
    var _allIds=CASES.map(function(c){return c.id;}).concat(GEMINI_CASES.map(function(c){return c.id;}));q.id=_allIds.length>0?Math.max.apply(null,_allIds)+1:1;
    q.difficulty=diff;
    q.framework=fw;
    
    var qcErrors=[];
    if(!q.options||q.options.length!==4) qcErrors.push('選択肢が4つありません');
    if(!q.bestAnswer||['a','b','c','d'].indexOf(q.bestAnswer)<0) qcErrors.push('bestAnswerが不正');
    if(!q.situation||q.situation.length<30) qcErrors.push('状況文が短すぎます');
    if(!q.question||q.question.length<5) qcErrors.push('設問文がありません');
    if(!q.explanation||q.explanation.length<30) qcErrors.push('解説が短すぎます');
    
    if(q.options&&q.options.length===4){
      var optIds=q.options.map(function(o){return o.id;}).sort().join('');
      if(optIds!=='abcd') qcErrors.push('選択肢IDがa/b/c/dではありません');
      if(!q.options.find(function(o){return o.id===q.bestAnswer;})) qcErrors.push('bestAnswerが選択肢に存在しません');
      var bestL=q.options.find(function(o){return o.id===q.bestAnswer;});
      var othL=q.options.filter(function(o){return o.id!==q.bestAnswer;});
      if(bestL&&othL.length===3){
        var bLen=bestL.label.length;var aOth=othL.reduce(function(s,o){return s+o.label.length;},0)/3;
        if(aOth>0&&bLen/aOth>=2.0) qcErrors.push('正答labelが不正解の'+Math.round(bLen/aOth*10)/10+'倍長い');
      }
      q.options.forEach(function(o){
        if(o.label.length>=5&&'をでにのとはがしてりめけさせ'.indexOf(o.label[o.label.length-1])>=0) qcErrors.push(o.id.toUpperCase()+' 途切れ');
        if(o.label.length<8) qcErrors.push(o.id.toUpperCase()+' 短すぎ('+o.label.length+'文字)');
        if(!o.description||o.description.length<5) qcErrors.push(o.id.toUpperCase()+' description不足');
      });
      // 設問文がSO/WO等の方向性を示唆していないか
      if(q.question&&(q.question.indexOf('強みを活かし')>=0||q.question.indexOf('機会を捉え')>=0||q.question.indexOf('弱みを克服')>=0)) qcErrors.push('設問文が戦略の方向性を示唆している');
      // 状況文が正答をヒントしていないか
      if(q.situation&&q.bestAnswer){
        var bestOpt=q.options.find(function(o){return o.id===q.bestAnswer;});
        if(bestOpt){
          var keywords=bestOpt.label.match(/[\u4e00-\u9faf]{3,}/g)||[];
          var hintCount=0;
          keywords.forEach(function(kw){if(q.situation.indexOf(kw)>=0)hintCount++;});
          if(hintCount>=2) qcErrors.push('状況文に正答のキーワードが'+hintCount+'個含まれている（ヒントになる）');
        }
      }
      // 解説が短すぎないか
      if(q.explanation&&q.explanation.length<100) qcErrors.push('解説が短すぎます（'+q.explanation.length+'文字）');
    }
    
    var checkHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:10px">📋 品質チェック</div>';
    if(qcErrors.length>0){
      qcErrors.forEach(function(e){checkHtml+='<div style="font-size:11px;color:#c4554e;padding:3px 0">❌ '+e+'</div>';});
    }else{
      checkHtml+='<div style="font-size:11px;color:#4a9e6e">✅ 全チェック合格</div>';
    }
    checkHtml+='</div>';
    
    
    var previewHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#4a9e6e;margin-bottom:10px">✓ 問題プレビュー</div>'
      +'<div style="font-size:11px;color:#9a968e;margin-bottom:4px">'+esc(q.industry)+' / '+esc(q.framework)+' / '+esc(q.difficulty)+'</div>'
      +'<div style="font-size:13px;color:#e8e4d9;margin-bottom:10px;line-height:1.6">'+esc(q.situation)+'</div>'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:8px">'+esc(q.question)+'</div>'
      +q.options.map(function(o){return'<div style="padding:8px 10px;margin:4px 0;border-radius:6px;font-size:12px;'+(o.id===q.bestAnswer?'background:#1a2a1a;border:1px solid #4a9e6e;color:#4a9e6e':'background:#1a1a18;color:#bab7ae')+'">'
        +o.id.toUpperCase()+': '+esc(o.label)+(o.id===q.bestAnswer?' ✓':'')+'</div>';}).join('')
      +'<div style="margin-top:8px;font-size:11px;color:#9a968e;line-height:1.5">'+esc((q.explanation||'').substring(0,200))+'...</div></div>';
    
    var adversarialHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:8px">⚔️ 反論テスト</div>'
      +'<div style="font-size:10px;color:#9a968e;margin-bottom:8px">不正解が実は正答より優れていないか検証します</div>'
      +'<button onclick="runAdversarialReview()" class="btn" style="background:#3a3a38;color:#e8e4d9;padding:10px;font-size:12px">🔍 反論テストを実行</button>'
      +'<div id="adversarialResult" style="margin-top:8px"></div></div>';
    var aiReviewHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:8px">🤖 AI品質レビュー</div>'
      +'<button onclick="runAiReview()" class="btn" style="background:#3a3a38;color:#e8e4d9;padding:10px;font-size:12px">◆ 3.1 Pro でレビュー実行</button>'
      +'<div id="aiReviewResult" style="margin-top:8px"></div></div>';
    
    var actHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
      +(qcErrors.length===0?'<button onclick="addGeneratedQuestion()" class="btn" style="background:#4a9e6e;color:#fff;padding:12px;font-size:13px">✓ 追加する</button>':'<button disabled class="btn" style="background:#2a2a28;color:#807d74;padding:12px;font-size:13px">❌ エラーあり</button>')
      +'<button onclick="screen=\'create_q\';render()" class="btn" style="background:#2a2a28;color:#e8e4d9;padding:12px;font-size:13px">✗ やり直す</button></div>';
    
    result.innerHTML=checkHtml+previewHtml+adversarialHtml+aiReviewHtml+actHtml;
    window._pendingQuestion=q;
    
  }catch(err){
    result.innerHTML='<div style="background:#2a1a1a;border-radius:10px;padding:14px;color:#c4554e;font-size:12px">⚠️ '+err.message+'</div>';
  }finally{
    btn.disabled=false;btn.textContent='🤖 問題を生成';
  }
}

function addGeneratedQuestion(){
  if(!window._pendingQuestion)return;
  window._pendingQuestion.source='gemini';
  GEMINI_CASES.push(window._pendingQuestion);
  try{localStorage.setItem('gemini_questions',JSON.stringify(GEMINI_CASES));}catch(e){}
  alert('✓ Gemini問題に追加しました\nGemini問題数: '+GEMINI_CASES.length+'問');
  window._pendingQuestion=null;
  screen='create_q';render();
}


async function runAiReview(){
  var q=window._pendingQuestion;
  if(!q||!gemKey)return;
  var sec=document.getElementById('aiReviewResult');
  sec.innerHTML='<div style="color:#d4a853;font-size:11px">🔄 AIレビュー中...</div>';
  
  var reviewPrompt='以下の事業戦略4択問題を品質レビューしてください。\n\n'
    +'【問題データ】\n'+JSON.stringify(q,null,2)+'\n\n'
    +'以下の5項目を評価し、JSON形式で回答してください。JSON以外は一切出力しないでください。\n'
    +'{\n'
    +'"difficulty_ok": true/false, // 指定難易度（'+q.difficulty+'）に適切か\n'
    +'"difficulty_comment": "難易度の評価コメント",\n'
    +'"options_balanced": true/false, // 4つの選択肢のもっともらしさは均等か\n'
    +'"options_comment": "選択肢バランスの評価",\n'
    +'"answer_correct": true/false, // bestAnswerは本当に最適解か\n'
    +'"answer_comment": "正答の妥当性コメント",\n'
    +'"explanation_ok": true/false, // 解説は正答を適切に説明しているか\n'
    +'"explanation_comment": "解説の評価",\n'
    +'"overall_score": 1-5, // 総合スコア（5が最高）\n'
    +'"overall_comment": "総合コメント",\n'
    +'"suggested_fixes": ["修正提案1","修正提案2"] // 改善点（なければ空配列）\n'
    +'}';
  
  try{
    var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL_INFO.pro31.api+':generateContent?key='+getApiKey('pro31'),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:reviewPrompt}]}],generationConfig:{maxOutputTokens:2000,temperature:0.3}})
    });
    var data=await res.json();
    if(!data.candidates||!data.candidates[0])throw new Error(data.error?.message||'応答なし');
    
    var text=data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    text=text.replace(/```json|```/g,'').trim();
    var review=JSON.parse(text);
    
    var items=[
      {key:'difficulty_ok',label:'難易度',comment:review.difficulty_comment},
      {key:'options_balanced',label:'選択肢バランス',comment:review.options_comment},
      {key:'answer_correct',label:'正答の妥当性',comment:review.answer_comment},
      {key:'explanation_ok',label:'解説品質',comment:review.explanation_comment}
    ];
    
    var stars='';
    for(var i=0;i<5;i++){stars+=(i<(review.overall_score||0))?'★':'☆';}
    
    var rhtml='<div style="margin-top:8px">';
    items.forEach(function(item){
      var ok=review[item.key];
      rhtml+='<div style="font-size:11px;padding:4px 0;color:'+(ok?'#4a9e6e':'#c4554e')+'">'+(ok?'✅':'❌')+' '+item.label+': '+item.comment+'</div>';
    });
    rhtml+='<div style="margin-top:8px;font-size:13px;color:#d4a853">'+stars+' ('+review.overall_score+'/5)</div>';
    rhtml+='<div style="font-size:11px;color:#bab7ae;margin-top:4px">'+review.overall_comment+'</div>';
    
    if(review.suggested_fixes&&review.suggested_fixes.length>0){
      rhtml+='<div style="margin-top:8px;font-size:11px;color:#d4a853">💡 改善提案:</div>';
      review.suggested_fixes.forEach(function(fix){rhtml+='<div style="font-size:10px;color:#a8a49c;padding:2px 0">・'+fix+'</div>';});
    }
    rhtml+='</div>';
    sec.innerHTML=rhtml;
    
  }catch(err){
    sec.innerHTML='<div style="color:#c4554e;font-size:11px">⚠️ レビューエラー: '+err.message+'</div>';
  }
}

function deleteGeminiQuestion(id){

}


// (旧runAdversarialReview(q)は削除済み — v63)

async function runAdversarialReview(){
  var q=window._pendingQuestion;
  if(!q||!gemKey)return;
  var sec=document.getElementById('adversarialResult');
  if(!sec)return;
  sec.innerHTML='<div style="color:#d4a853;font-size:11px">🔍 反論テスト実行中...</div>';
  
  var modelKey=document.getElementById('cqModelVal')?.value||'pro31';
  var wrongOpts=q.options.filter(function(o){return o.id!==q.bestAnswer;});
  var correctOpt=q.options.find(function(o){return o.id===q.bestAnswer;});
  
  var prompt='あなたは事業戦略の専門家であり、問題品質の検証者です。\n\n'
    +'以下の4択問題で、正答は'+q.bestAnswer.toUpperCase()+'「'+correctOpt.label+'」とされています。\n\n'
    +'【状況】'+q.situation+'\n'
    +'【設問】'+q.question+'\n'
    +'【選択肢】\n'
    +q.options.map(function(o){return o.id.toUpperCase()+': '+o.label+(o.id===q.bestAnswer?' (正答)':'');}).join('\n')+'\n\n'
    +'以下の不正解について、それぞれ「実はこの選択肢の方が正答より優れている」という反論を試みてください。\n\n'
    +wrongOpts.map(function(o){return o.id.toUpperCase()+': '+o.label;}).join('\n')+'\n\n'
    +'JSON形式で回答してください。JSON以外は一切出力しないでください。\n'
    +'{"reviews":[\n'
    +wrongOpts.map(function(o){
      return '  {"id":"'+o.id+'","label":"'+o.label.substring(0,20)+'...","counterArgument":"この選択肢が正答より優れている理由","isValid":true/false,"reason":"反論が成立する/しない理由"}';
    }).join(',\n')+'\n'
    +'],"overallPass":true/false,"summary":"総合判定コメント"}';

  try{
    var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(MODEL_INFO[modelKey]||MODEL_INFO.pro31).api+':generateContent?key='+getApiKey(modelKey||'pro31'),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:4000,temperature:0.2}})
    });
    var data=await res.json();
    if(!data.candidates||!data.candidates[0])throw new Error(data.error?.message||'応答なし');
    
    var text=data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    text=text.replace(/```json|```/g,'').trim();
    if(!text.endsWith('}'))text=text.substring(0,text.lastIndexOf('}')+1);
    var review=JSON.parse(text);
    
    var rhtml='<div style="margin-top:8px">';
    var hasFail=false;
    if(review.reviews){
      review.reviews.forEach(function(r){
        var valid=r.isValid;
        if(valid)hasFail=true;
        rhtml+='<div style="font-size:11px;padding:6px 0;border-bottom:1px solid #1a1a18">'
          +'<div style="color:'+(valid?'#c4554e':'#4a9e6e')+';font-weight:700">'+(valid?'❌ '+r.id.toUpperCase()+': 反論が成立':'✅ '+r.id.toUpperCase()+': 反論不成立')+'</div>'
          +'<div style="color:#a8a49c;font-size:10px;margin-top:3px">'+r.counterArgument+'</div>'
          +'<div style="color:#9a968e;font-size:10px;margin-top:2px">→ '+r.reason+'</div>'
          +'</div>';
      });
    }
    rhtml+='<div style="margin-top:8px;font-size:12px;font-weight:700;color:'+(hasFail?'#c4554e':'#4a9e6e')+'">'
      +(hasFail?'❌ 反論テスト不合格 — 正答の優位性が不十分です':'✅ 反論テスト合格 — 正答の優位性が確認されました')+'</div>';
    if(hasFail){
      rhtml+='<button onclick="fixQuestionFromReview()" class="btn" style="background:#5b8fb9;color:#fff;padding:10px;font-size:12px;margin-top:8px">🔧 AIで修正して再チェック</button>';
    }
    if(review.summary){
      rhtml+='<div style="font-size:10px;color:#a8a49c;margin-top:4px">'+review.summary+'</div>';
    }
    
    // If failed, disable the add button
    if(hasFail){
      var addBtn=document.querySelector('button[onclick*="addGeneratedQuestion"]');
      if(addBtn){addBtn.disabled=true;addBtn.style.background='#2a2a28';addBtn.style.color='#4a4840';addBtn.textContent='❌ 反論テスト不合格';}
    }
    
    rhtml+='</div>';
    sec.innerHTML=rhtml;
    
  }catch(err){
    sec.innerHTML='<div style="color:#c4554e;font-size:11px">⚠️ 反論テストエラー: '+err.message+'</div>';
  }
}


async function fixQuestionFromReview(){
  var q=window._pendingQuestion;
  if(!q||!gemKey)return;
  var sec=document.getElementById('adversarialResult');
  var reviewText=sec?sec.innerText:'';
  
  var btn=document.querySelector('button[onclick*="fixQuestion"]');
  if(btn){btn.disabled=true;btn.textContent='🔧 修正中...';}
  
  var modelKey=document.getElementById('cqModelVal')?.value||'pro31';
  
  var prompt='以下の4択問題は反論テストで不合格になりました。不合格の理由を踏まえ、問題を修正してください。\n\n'
    +'【現在の問題】\n'+JSON.stringify(q,null,2)+'\n\n'
    +'【反論テスト結果】\n'+reviewText+'\n\n'
    +'【修正方針】\n'
    +'- 正答の優位性が明確になるよう修正すること\n'
    +'- 反論が成立した不正解について、その選択肢の致命的な欠点を状況文や解説に追加すること\n'
    +'- 正答を変更しても構わない（反論が成立した選択肢を正答にしても良い）\n'
    +'- 選択肢のlabel・description・解説を全て整合的に修正すること\n'
    +'- 元の問題の業種・FW・難易度・状況設定は維持すること\n\n'
    +'修正した問題をJSON形式で出力してください。JSON以外は一切出力しないでください。\n'
    +'元のJSONと同じ形式で出力してください。';

  try{
    var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+(MODEL_INFO[modelKey]||MODEL_INFO.pro31).api+':generateContent?key='+getApiKey(modelKey||'pro31'),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:8192,temperature:0.5}})
    });
    var data=await res.json();
    if(!data.candidates||!data.candidates[0])throw new Error(data.error?.message||'応答なし');
    
    var text=data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    text=text.replace(/```json|```/g,'').trim();
    if(!text.endsWith('}'))text=text.substring(0,text.lastIndexOf('}')+1);
    var fixed=JSON.parse(text);
    
    // Preserve original metadata
    fixed.id=q.id;
    fixed.difficulty=q.difficulty;
    fixed.framework=q.framework;
    fixed.source='gemini';
    
    // Update pending question
    window._pendingQuestion=fixed;
    
    // Re-run structural check and show preview
    // Trigger the same display as after generation
    var result=document.getElementById('cqResult');
    
    var qcErrors=[];
    if(!fixed.options||fixed.options.length!==4) qcErrors.push('選択肢が4つありません');
    if(!fixed.bestAnswer||['a','b','c','d'].indexOf(fixed.bestAnswer)<0) qcErrors.push('bestAnswerが不正');
    if(!fixed.situation||fixed.situation.length<30) qcErrors.push('状況文が短すぎます');
    if(!fixed.explanation||fixed.explanation.length<30) qcErrors.push('解説が短すぎます');
    if(fixed.options&&fixed.options.length===4){
      var bestL=fixed.options.find(function(o){return o.id===fixed.bestAnswer;});
      var othL=fixed.options.filter(function(o){return o.id!==fixed.bestAnswer;});
      if(bestL&&othL.length===3){
        var bLen=bestL.label.length;var aOth=othL.reduce(function(s,o){return s+o.label.length;},0)/3;
        if(aOth>0&&bLen/aOth>=2.0) qcErrors.push('正答labelが長すぎ');
      }
      fixed.options.forEach(function(o){
        if(o.label.length<8) qcErrors.push(o.id.toUpperCase()+' 短すぎ');
        if(!o.description||o.description.length<5) qcErrors.push(o.id.toUpperCase()+' description不足');
      });
      if(fixed.explanation&&fixed.explanation.length<100) qcErrors.push('解説が短すぎます');
    }
    
    var checkHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:10px">📋 修正後の品質チェック</div>';
    if(qcErrors.length>0){qcErrors.forEach(function(e){checkHtml+='<div style="font-size:11px;color:#c4554e;padding:3px 0">❌ '+e+'</div>';});}
    else{checkHtml+='<div style="font-size:11px;color:#4a9e6e">✅ 全チェック合格</div>';}
    checkHtml+='</div>';
    
    var previewHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#5ba0d0;margin-bottom:10px">🔧 修正後プレビュー</div>'
      +'<div style="font-size:11px;color:#9a968e;margin-bottom:4px">'+esc(fixed.industry)+' / '+esc(fixed.framework)+' / '+esc(fixed.difficulty)+'</div>'
      +'<div style="font-size:13px;color:#e8e4d9;margin-bottom:10px;line-height:1.6">'+esc(fixed.situation)+'</div>'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:8px">'+esc(fixed.question)+'</div>'
      +fixed.options.map(function(o){return'<div style="padding:8px 10px;margin:4px 0;border-radius:6px;font-size:12px;'+(o.id===fixed.bestAnswer?'background:#1a2a1a;border:1px solid #4a9e6e;color:#4a9e6e':'background:#1a1a18;color:#bab7ae')+'">'
        +o.id.toUpperCase()+': '+esc(o.label)+(o.id===fixed.bestAnswer?' ✓':'')+'</div>';}).join('')
      +'<div style="margin-top:8px;font-size:11px;color:#9a968e;line-height:1.5">'+esc(fixed.explanation||'')+'</div></div>';
    
    var adversarialHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:8px">⚔️ 反論テスト</div>'
      +'<button onclick="runAdversarialReview()" class="btn" style="background:#3a3a38;color:#e8e4d9;padding:10px;font-size:12px">🔍 再度テストを実行</button>'
      +'<div id="adversarialResult" style="margin-top:8px"></div></div>';
    
    var actHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
      +(qcErrors.length===0?'<button onclick="addGeneratedQuestion()" class="btn" style="background:#4a9e6e;color:#fff;padding:12px;font-size:13px">✓ 追加する</button>':'<button disabled class="btn" style="background:#2a2a28;color:#807d74;padding:12px;font-size:13px">❌ エラーあり</button>')
      +'<button onclick="screen=\'create_q\';render()" class="btn" style="background:#2a2a28;color:#e8e4d9;padding:12px;font-size:13px">✗ やり直す</button></div>';
    
    result.innerHTML=checkHtml+previewHtml+adversarialHtml+actHtml;
    
  }catch(err){
    if(btn){btn.disabled=false;btn.textContent='🔧 AIで修正';}
    alert('修正エラー: '+err.message);
  }
}

function bindAll(){
  // Mobile: ensure all interactive elements respond to touch
  document.querySelectorAll('button,select,input[type=range]').forEach(function(el){el.style.touchAction='manipulation';});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;compTarget=null;render();});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{aFw=b.dataset.f;render();});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{compTarget=b.dataset.c;render();});
  const qn=document.getElementById('qnum'),qv=document.getElementById('qval');
  if(qn&&qv)qn.oninput=()=>{qv.textContent=qn.value;};
  document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{window.aDiff=b.dataset.diff;render();});
  const tu=document.getElementById('toggleUnanswered');if(tu)tu.onclick=()=>{onlyUnanswered=!onlyUnanswered;if(onlyUnanswered){onlyWrong=false;window.onlyBookmarked=false;}render();};
  const tw=document.getElementById('toggleWrong');if(tw)tw.onclick=()=>{onlyWrong=!onlyWrong;if(onlyWrong){onlyUnanswered=false;window.onlyBookmarked=false;}render();};
  const tb=document.getElementById('toggleBookmarked');if(tb)tb.onclick=()=>{window.onlyBookmarked=!window.onlyBookmarked;if(window.onlyBookmarked){onlyUnanswered=false;onlyWrong=false;onlySrsDue=false;}render();};
  const ts=document.getElementById('toggleSrs');if(ts)ts.onclick=()=>{onlySrsDue=!onlySrsDue;if(onlySrsDue){onlyUnanswered=false;onlyWrong=false;window.onlyBookmarked=false;}render();};
  const st=document.getElementById('startBtn');if(st)st.onclick=()=>{const p=pool();if((mode==='individual'&&p.length>=1)||(mode==='comp'&&compTarget))start();};
  if(screen==='quiz'&&!rev){document.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{sel=b.dataset.id;render();});const s=document.getElementById('sub');if(s)s.onclick=()=>{if(!sel)return;const isOk=sel===quiz[idx].bestAnswer;results[idx]=isOk?'correct':'wrong';saveAnswer(quiz[idx].id,isOk);rev=true;chatHist=[];chatTurns=0;render();};}
  const s3t=document.getElementById('sel3t');if(s3t)s3t.onclick=()=>{chatMaxTurns=3;render();};
  const s5t=document.getElementById('sel5t');if(s5t)s5t.onclick=()=>{chatMaxTurns=5;render();};
  const cs=document.getElementById('chatStart');if(cs)cs.onclick=()=>{sessionCost=0;chatHist.push({role:'model',content:'このケースについて壁打ちしましょう。正解の戦略について疑問に思うこと、別の条件だったらどうなるか、もっと深く知りたい点など、何でも聞いてください。'});render();};
  const n=document.getElementById('nxt');if(n)n.onclick=()=>{if(idx+1>=total)screen='score';else{idx++;sel=null;rev=false;chatHist=[];chatTurns=0;}render();window.scrollTo({top:0,behavior:'smooth'});};
  const r=document.getElementById('retry');if(r)r.onclick=()=>{screen='start';render();};
  const hb=document.getElementById('goHomeBtn');if(hb)hb.onclick=goHome;
  document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{gemModel=b.dataset.model;try{localStorage.setItem('gemini_model',gemModel);}catch(e){}render();});
  const sk=document.getElementById('saveKey');if(sk)sk.onclick=()=>{const v=document.getElementById('gemKeyInput').value.trim();const vf=(document.getElementById('gemKeyFreeInput')||{}).value?.trim()||'';gemKey=v;gemKeyFree=vf;try{localStorage.setItem('gemini_key',v);localStorage.setItem('gemini_key_free',vf);}catch(e){}screen='start';render();};
}

// === SRS: Start review of due questions from home ===
function startSrsDue(){
  const now2=Date.now();
  const dueIds=Object.entries(srsData).filter(([id,d])=>d.nextReview&&d.nextReview<=now2).map(([id])=>parseInt(id));
  const dueQs=CASES.filter(c=>dueIds.includes(c.id));
  if(dueQs.length===0){alert('復習期限の問題はありません');return;}
  mode='individual';questionSource='claude';
  quiz=shuffle(dueQs).slice(0,Math.min(20,dueQs.length));
  total=quiz.length;idx=0;sel=null;rev=false;results={};chatHist=[];chatTurns=0;screen='quiz';render();
}

// === Search Screen (B1) ===
function rSearch(){
  const q=searchQuery.toLowerCase();
  let resultsHtml='';
  if(q.length>=2){
    searchResults=CASES.filter(c=>
      c.industry.toLowerCase().includes(q)||c.situation.toLowerCase().includes(q)||
      c.question.toLowerCase().includes(q)||c.framework.toLowerCase().includes(q)
    ).slice(0,30);
    resultsHtml=searchResults.length===0
      ?'<div style="text-align:center;color:#9a968e;padding:20px">該当する問題が見つかりません</div>'
      :searchResults.map(c=>{
        const answered=answerHistory[c.id];
        const icon=answered==='correct'?'✓':answered==='wrong'?'✗':'';
        const iconColor=answered==='correct'?'#6ec992':answered==='wrong'?'#c4554e':'#4a4840';
        return`<div style="padding:10px 12px;background:#141413;border:1px solid #2a2a28;border-radius:10px;margin-bottom:8px;cursor:pointer" onclick="jumpToQuestion(${c.id})">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:11px;color:#d4a853;font-weight:700">${esc(c.framework)}</span>
            <span style="font-size:10px;color:${iconColor};font-weight:800">${icon} ID:${c.id}</span>
          </div>
          <div style="font-size:13px;color:#e8e4d9;font-weight:600;margin:4px 0">${esc(c.industry)}</div>
          <div style="font-size:11px;color:#a8a49c;line-height:1.4">${esc(c.question.substring(0,60))}${c.question.length>60?'...':''}</div>
        </div>`;
      }).join('');
  }else if(q.length>0){
    resultsHtml='<div style="text-align:center;color:#9a968e;padding:20px;font-size:12px">2文字以上入力してください</div>';
  }
  return`<div class="ctn fade-in">
    ${rBackBtn()}
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:16px;font-weight:800">🔍 問題検索</div></div>
    <input type="text" id="searchInput" value="${esc(searchQuery)}" placeholder="業種名・キーワードで検索..." style="width:100%;padding:12px 14px;background:#141413;border:1px solid #2a2a28;border-radius:10px;color:#e8e4d9;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:12px" oninput="searchQuery=this.value;render()">
    <div style="color:#9a968e;font-size:11px;margin-bottom:8px">${searchResults.length>0?searchResults.length+'件ヒット':''}</div>
    ${resultsHtml}
  </div>`;
}

// === Comp progress tracker (B2) ===
function getCompProgress(){
  const progress={};
  Object.entries(COMP_IDS).forEach(([name,ids])=>{
    const answered=ids.filter(id=>answerHistory[id]).length;
    const correct=ids.filter(id=>answerHistory[id]==='correct').length;
    progress[name]={total:ids.length,answered,correct,done:answered===ids.length};
  });
  return progress;
}

// === Weakest FW detection (A3) ===
function getWeakestFW(){
  const fws=['PESTLE分析','5フォース分析','SWOT分析','クロスSWOT分析','アンゾフの成長マトリクス','STP分析','4P/4C分析','グロースモデル選択','KPI設計','実行戦略パターン'];
  let weakest=null,worstRate=100;
  fws.forEach(fw=>{
    const qs=CASES.filter(c=>c.framework===fw);
    const answered=qs.filter(c=>answerHistory[c.id]);
    if(answered.length<5)return;
    const correct=qs.filter(c=>answerHistory[c.id]==='correct');
    const rate=Math.round(correct.length/answered.length*100);
    if(rate<worstRate){worstRate=rate;weakest={fw,rate,answered:answered.length,wrong:answered.length-correct.length};}
  });
  return weakest;
}
function startWeakFwPractice(){
  const w=getWeakestFW();
  if(!w)return;
  mode='individual';questionSource='claude';aFw=w.fw;onlyWrong=true;
  const p=pool();
  if(p.length===0){onlyWrong=false;}
  quiz=shuffle(pool()).slice(0,Math.min(10,pool().length));
  total=quiz.length;idx=0;sel=null;rev=false;results={};chatHist=[];chatTurns=0;screen='quiz';
  aFw='all';onlyWrong=false;
  render();
}

// === Time series graph data (B4) ===
function getWeeklyStats(weeks){
  const result=[];
  const now=new Date();
  for(let w=weeks-1;w>=0;w--){
    const weekStart=new Date(now);weekStart.setDate(weekStart.getDate()-w*7);weekStart.setHours(0,0,0,0);
    const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);
    let total=0,correct=0;
    Object.entries(answerDates).forEach(([id,ts])=>{
      if(ts>=weekStart.getTime()&&ts<weekEnd.getTime()){total++;if(answerHistory[id]==='correct')correct++;}
    });
    result.push({label:(weekStart.getMonth()+1)+'/'+weekStart.getDate(),total,correct,rate:total>0?Math.round(correct/total*100):null});
  }
  return result;
}

async function generateReviewCard(sessionId){
  if(!gemKey)return;
  const sessions=getSparringSessions();
  const s=sessions.find(x=>x.id===sessionId);
  if(!s||s.reviewCard&&s.reviewCard.strength!=='（解析中）')return;
  const activeModel=(s.difficulty==='初級')?'flash':(s.model||'flash');
  const chatLog=s.history.map(m=>(m.role==='user'?'ユーザー：':'AI：')+m.content).join('\n');
  const prompt=`以下の壁打ち（戦略議論）のログを分析し、必ず以下の4項目だけをJSON形式で返してください。他の文字は一切不要です。

{"summary":"議論内容の1行要約（30文字以内）","strength":"ユーザーの戦略的思考の強み（40文字以内）","improvement":"改善ポイント（40文字以内）","weaknessPattern":"改善ポイントを抽象化した思考パターン。特定のFWに依存しない上位概念で表現（例：外部脅威の想定力が弱い、定量的な検証が不足、時間軸の考慮が甘い等）（30文字以内）"}

【ケース】${s.industry} / ${s.framework}
【問い】${s.question}
【議論ログ】
${chatLog}`;
  try{
    const controller=new AbortController();
    const tid=setTimeout(()=>controller.abort(),20000);
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_INFO[activeModel].api}:generateContent?key=${getApiKey(activeModel||gemModel)}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:500,temperature:0.3}}),
      signal:controller.signal
    });
    clearTimeout(tid);
    const data=await res.json();
    if(data.candidates&&data.candidates[0]){
      let text=data.candidates[0].content.parts.map(p=>p.text||'').join('').trim();
      text=text.replace(/```json|```/g,'').trim();
      try{
        const card=JSON.parse(text);
        if(card.summary&&card.strength&&card.improvement){if(!card.weaknessPattern)card.weaknessPattern=card.improvement;
          s.reviewCard=card;
          try{localStorage.setItem('sparring_sessions',JSON.stringify(sessions));}catch(e){}
          if(screen==='sparring_history'||screen==='sparring_view')render();
        }
      }catch(pe){
        // Don't save failed card - leave reviewCard undefined so retry is possible
        console.log('Review card parse failed, will retry later');
      }
    }
  }catch(e){console.log('Review card generation failed:',e);}
}

function getTopWeaknessPattern(){
  const sessions=getSparringSessions();
  const patterns={};
  sessions.forEach(s=>{
    if(s.reviewCard&&s.reviewCard.weaknessPattern){
      const p=s.reviewCard.weaknessPattern;
      patterns[p]=(patterns[p]||0)+1;
    }
  });
  const sorted=Object.entries(patterns).sort((a,b)=>b[1]-a[1]);
  if(sorted.length===0)return null;
  return {pattern:sorted[0][0],count:sorted[0][1],total:sessions.filter(s=>s.reviewCard).length};
}

function rCalendar(){
  const now=new Date();
  const cm=window._calMonth!==undefined?window._calMonth:now.getMonth();
  const cy=window._calYear!==undefined?window._calYear:now.getFullYear();
  const firstDay=new Date(cy,cm,1).getDay();
  const daysInMonth=new Date(cy,cm+1,0).getDate();
  const monthNames=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // Aggregate answer dates by day
  const dayStats={};
  Object.entries(answerDates).forEach(([id,ts])=>{
    const d=new Date(ts);
    if(d.getMonth()===cm&&d.getFullYear()===cy){
      const day=d.getDate();
      if(!dayStats[day])dayStats[day]={total:0,correct:0};
      dayStats[day].total++;
      if(answerHistory[id]==='correct')dayStats[day].correct++;
    }
  });

  let cells='';
  const dayLabels=['日','月','火','水','木','金','土'];
  dayLabels.forEach(d=>{cells+='<div style="text-align:center;font-size:10px;color:#9a968e;font-weight:700;padding:4px">'+d+'</div>';});
  for(let i=0;i<firstDay;i++)cells+='<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const st=dayStats[d];
    const isToday=d===now.getDate()&&cm===now.getMonth()&&cy===now.getFullYear();
    let bg='transparent',border='transparent',numColor='#6b6860';
    if(st){
      const rate=st.total>0?st.correct/st.total:0;
      bg=rate>=0.7?'#0f1a14':rate>=0.4?'#1a1810':'#1a0f0e';
      border=rate>=0.7?'#1a3526':rate>=0.4?'#3a3520':'#2a1a18';
      numColor='#e8e4d9';
    }
    if(isToday)border='#5b8fb9';
    cells+='<div style="text-align:center;padding:6px 2px;background:'+bg+';border:1px solid '+border+';border-radius:6px;min-height:44px">'
      +'<div style="font-size:12px;color:'+numColor+';font-weight:'+(isToday?'800':'400')+'">'+d+'</div>'
      +(st?'<div style="font-size:9px;color:'+(st.correct/st.total>=0.7?'#4a9e6e':st.correct/st.total>=0.4?'#d4a853':'#c4554e')+'">'+st.correct+'/'+st.total+'</div>':'')
      +'</div>';
  }

  // Monthly summary
  let monthTotal=0,monthCorrect=0;
  Object.values(dayStats).forEach(s=>{monthTotal+=s.total;monthCorrect+=s.correct;});
  const activeDays=Object.keys(dayStats).length;
  const streak=calcStreak();

  return '<div class="ctn fade-in">'
    +rBackBtn()
    +'<div style="text-align:center;margin-bottom:16px"><div style="font-size:16px;font-weight:800">📅 学習カレンダー</div></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<button onclick="window._calMonth='+((cm-1+12)%12)+';window._calYear='+(cm===0?cy-1:cy)+';render()" style="background:none;border:none;color:#9a968e;font-size:18px;cursor:pointer;padding:8px">←</button>'
    +'<div style="font-size:15px;font-weight:700;color:#e8e4d9">'+cy+'年 '+monthNames[cm]+'</div>'
    +'<button onclick="window._calMonth='+((cm+1)%12)+';window._calYear='+(cm===11?cy+1:cy)+';render()" style="background:none;border:none;color:#9a968e;font-size:18px;cursor:pointer;padding:8px">→</button>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px">'+cells+'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
    +'<div style="text-align:center;padding:12px;background:#0f0f0e;border-radius:10px"><div style="font-size:18px;font-weight:900;color:#d4a853">'+monthTotal+'</div><div style="font-size:9px;color:#9a968e">今月の回答数</div></div>'
    +'<div style="text-align:center;padding:12px;background:#0f0f0e;border-radius:10px"><div style="font-size:18px;font-weight:900;color:#6ec992">'+activeDays+'</div><div style="font-size:9px;color:#9a968e">学習日数</div></div>'
    +'<div style="text-align:center;padding:12px;background:#0f0f0e;border-radius:10px"><div style="font-size:18px;font-weight:900;color:#5b8fb9">'+streak+'</div><div style="font-size:9px;color:#9a968e">連続日数 🔥</div></div>'
    +'</div>'
    +'<div style="margin-top:12px;padding:12px;background:#0f0f0e;border-radius:10px">'
    +'<div style="display:flex;gap:12px;justify-content:center;font-size:10px;color:#9a968e">'
    +'<span>🟢 70%+</span><span>🟡 40-69%</span><span>🔴 ~39%</span><span style="color:#5b8fb9">■ 今日</span>'
    +'</div></div>'
    +'</div>';
}

function calcStreak(){
  const today=new Date();today.setHours(0,0,0,0);
  let streak=0;
  const dateSet=new Set();
  Object.values(answerDates).forEach(ts=>{const d=new Date(ts);d.setHours(0,0,0,0);dateSet.add(d.getTime());});
  let checkDate=new Date(today);
  // If no answers today, start from yesterday
  if(!dateSet.has(checkDate.getTime())){checkDate.setDate(checkDate.getDate()-1);}
  while(dateSet.has(checkDate.getTime())){streak++;checkDate.setDate(checkDate.getDate()-1);}
  return streak;
}

let syncUrl='',syncId='';
try{syncUrl=localStorage.getItem('sync_url')||'';}catch(e){}
try{syncId=localStorage.getItem('sync_id')||'';}catch(e){}
let syncStatus='disconnected'; // disconnected | syncing | synced | error
let syncTimer=null;
let lastSyncTime=0;

function isSyncEnabled(){return syncUrl&&syncId;}

async function pushToCloud(){
  if(!isSyncEnabled())return;
  syncStatus='syncing';updateSyncBadge();
  const data={
    h:answerHistory,
    m:gemModel,
    k:gemKey,
    c:{},
    t:Date.now(),
    // Expanded sync data
    ad:answerDates,
    bk:bookmarks,
    gq:GEMINI_CASES,
    sp:getSparringSessions(),
    sr:srsData,
    dm:darkMode,
    dg:dailyGoal
  };
  for(let i=0;i<12;i++){const d=new Date();d.setMonth(d.getMonth()-i);const key='monthly_cost_'+d.toISOString().slice(0,7);try{const v=localStorage.getItem(key);if(v)data.c[key]=v;}catch(e){}}
  try{
    const url=syncUrl.replace(/\/$/,'')+'/'+encodeURIComponent(syncId)+'.json';
    const res=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(res.ok){syncStatus='synced';lastSyncTime=Date.now();}
    else{syncStatus='error';}
  }catch(e){syncStatus='error';}
  updateSyncBadge();
}

async function pullFromCloud(){
  if(!isSyncEnabled()||_clearing)return;
  syncStatus='syncing';updateSyncBadge();
  try{
    const url=syncUrl.replace(/\/$/,'')+'/'+encodeURIComponent(syncId)+'.json';
    const res=await fetch(url);
    if(!res.ok){syncStatus='error';updateSyncBadge();return;}
    const data=await res.json();
    if(!data||!data.h){syncStatus='synced';updateSyncBadge();return;}
    let changed=false;
    if(_clearing)return;
    // Merge answer history
    Object.entries(data.h).forEach(([k,v])=>{
      if(!answerHistory[k]){answerHistory[k]=v;changed=true;}
    });
    if(changed){try{localStorage.setItem('answer_history',JSON.stringify(answerHistory));}catch(e){}}
    // Merge answer dates
    if(data.ad){Object.entries(data.ad).forEach(([k,v])=>{if(!answerDates[k]){answerDates[k]=v;}});try{localStorage.setItem('answer_dates',JSON.stringify(answerDates));}catch(e){}}
    // Merge bookmarks
    if(data.bk){Object.entries(data.bk).forEach(([k,v])=>{if(!bookmarks[k])bookmarks[k]=v;});try{localStorage.setItem('bookmarks',JSON.stringify(bookmarks));}catch(e){}}
    // Merge Gemini questions (by ID)
    if(data.gq&&Array.isArray(data.gq)){
      const existingIds=new Set(GEMINI_CASES.map(q=>q.id));
      data.gq.forEach(q=>{if(!existingIds.has(q.id))GEMINI_CASES.push(q);});
      try{localStorage.setItem('gemini_questions',JSON.stringify(GEMINI_CASES));}catch(e){}
    }
    // Merge sparring sessions
    if(data.sp&&Array.isArray(data.sp)){
      let sessions=getSparringSessions();
      const existingIds2=new Set(sessions.map(s=>s.id));
      data.sp.forEach(s=>{if(!existingIds2.has(s.id))sessions.push(s);});
      sessions.sort((a,b)=>b.id-a.id);
      try{localStorage.setItem('sparring_sessions',JSON.stringify(sessions.slice(0,50)));}catch(e){}
    }
    // Merge SRS data
    if(data.sr){Object.entries(data.sr).forEach(([k,v])=>{if(!srsData[k])srsData[k]=v;});try{localStorage.setItem('srs_data',JSON.stringify(srsData));}catch(e){}}
    // Sync preferences
    if(data.k&&!gemKey){gemKey=data.k;try{localStorage.setItem('gemini_key',gemKey);}catch(e){}}
    if(data.m&&data.m!==gemModel){gemModel=data.m;try{localStorage.setItem('gemini_model',gemModel);}catch(e){}}
    if(data.c){Object.entries(data.c).forEach(([k,v])=>{try{localStorage.setItem(k,v);}catch(e){}});}
    if(typeof data.dm==='boolean'){darkMode=data.dm;try{localStorage.setItem('dark_mode',data.dm?'true':'false');}catch(e){}}
    if(data.dg){dailyGoal=data.dg;try{localStorage.setItem('daily_goal',String(data.dg));}catch(e){}}
    syncStatus='synced';lastSyncTime=Date.now();
    if(changed&&screen==='start')render();
  }catch(e){syncStatus='error';}
  updateSyncBadge();
}

function schedulePush(){
  if(_clearing)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>pushToCloud(),2000); // debounce 2s
}

// Override saveAnswer to trigger sync
const _origSaveAnswer=saveAnswer;
saveAnswer=function(id,correct){
  _origSaveAnswer(id,correct);
  schedulePush();
};

function updateSyncBadge(){
  const el=document.getElementById('syncBadge');
  if(!el)return;
  const icons={disconnected:'⚫',syncing:'🔄',synced:'🟢',error:'🔴'};
  const labels={disconnected:'未接続',syncing:'同期中...',synced:'同期済み',error:'エラー'};
  el.textContent=icons[syncStatus]+' '+labels[syncStatus];
  el.style.color=syncStatus==='synced'?'#4a9e6e':syncStatus==='error'?'#c4554e':'#6b6860';
}

function saveSyncSettings(url,id){
  syncUrl=url;syncId=id;
  try{localStorage.setItem('sync_url',url);localStorage.setItem('sync_id',id);}catch(e){}
  if(isSyncEnabled()){
    pullFromCloud().then(()=>pushToCloud());
  }else{
    syncStatus='disconnected';updateSyncBadge();
  }
  render();
}

// Manual export/import as fallback
function doExport(){
  const data={h:answerHistory,m:gemModel,k:gemKey,c:{},t:Date.now()};
  for(let i=0;i<12;i++){const d=new Date();d.setMonth(d.getMonth()-i);const key='monthly_cost_'+d.toISOString().slice(0,7);try{const v=localStorage.getItem(key);if(v)data.c[key]=v;}catch(e){}}
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  navigator.clipboard.writeText(code).then(()=>{
    alert('同期コードをコピーしました（'+Object.keys(data.h).length+'問分）\n\n別端末の「インポート」に貼り付けてください');
  }).catch(()=>{prompt('コピーしてください：',code);});
}
function doImport(){
  const code=prompt('同期コードを貼り付け：');
  if(!code)return;
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!data.h){alert('無効なコードです');return;}
    const merged={...answerHistory,...data.h};
    if(!confirm('インポート（統合後 '+Object.keys(merged).length+'問）を実行？'))return;
    answerHistory=merged;
    try{localStorage.setItem('answer_history',JSON.stringify(answerHistory));}catch(e){}
    if(data.k&&!gemKey){gemKey=data.k;try{localStorage.setItem('gemini_key',gemKey);}catch(e){}}
    if(data.m){gemModel=data.m;try{localStorage.setItem('gemini_model',gemModel);}catch(e){}}
    alert('完了！');if(isSyncEnabled())pushToCloud();render();
  }catch(e){alert('無効なコードです');}
}

        shd.innerHTML='<button onclick="showSparringHistory()" style="width:100%;padding:12px;background:#141413;border:1px solid #2a2a28;border-radius:10px;color:#a8a49c;font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px">💬 壁打ち履歴'+(sc>0?' ('+sc+'件)':'')+'</button>';
        if(sd.nextSibling)sd.parentElement.insertBefore(shd,sd.nextSibling);
        else sd.parentElement.appendChild(shd);
      }
    }
  }
};
render=_renderWithSync;

// Initial sync on load
if(isSyncEnabled()){pullFromCloud();}

// Auto-pull when app returns to foreground (PWA resume)
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&isSyncEnabled()){pullFromCloud();}
});

// Splash screen
applyTheme();
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(()=>s.remove(),500);}},1800);
waitForCases();

</script></body></html>
