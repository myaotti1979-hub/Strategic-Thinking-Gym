async function sendChat(){(async()=>{
  try{
    const activeModel=(quiz[idx]&&quiz[idx].difficulty==='初級')?'flash':gemModel;
    const input=document.getElementById('chatInput');
    if(!input||!input.value.trim()||chatLoading||chatTurns>=chatMaxTurns)return;
    const userMsg=input.value.trim();
    input.value='';
    chatHist.push({role:'user',content:userMsg});
    chatTurns++;
    chatLoading=true;
    render();
    const c=quiz[idx];
    const userAns=c.options.find(o=>o.id===sel);
    const correctAns=c.options.find(o=>o.id===c.bestAnswer);
    const isLastTurn=chatTurns>=chatMaxTurns;
    const _wp=getTopWeaknessPattern();
    const _weaknessLine=_wp?'\n- 【コーチング指示】このユーザーの過去の傾向：「'+_wp.pattern+'」（'+_wp.count+'/'+_wp.total+'回の壁打ちで確認）。今回の'+c.framework+'の文脈でこの傾向に関連する視点があれば、議論の中で自然に深掘りしてください。直接弱点を指摘せず問いかけで気づかせること。':'';
    const sysPrompt=`あなたは事業戦略の専門家です。以下のケースについてユーザーと壁打ち（戦略議論）をしてください。
【ケース】${c.situation}
【問い】${c.question}
【ユーザーの回答】${userAns?userAns.label:'未選択'}
【正解】${correctAns?correctAns.label:''}
【解説】${c.explanation}
【フレームワーク】${c.framework}

ルール：
- 日本語で回答
- 400-600文字程度で丁寧に回答
- ユーザーの視点を尊重しつつ、戦略的な深い議論を
- 反論や別の視点も積極的に提示
- 実在企業の事例を交えて具体的に
${_weaknessLine}
${isLastTurn?'- 【重要】これが最後のターンです。新しい質問は投げかけず、これまでの議論を総括してください。ユーザーの戦略的思考の良かった点を具体的に挙げ、今後の学びのポイントをまとめて締めくくってください。':'- 回答の最後に、議論を深めるための問いかけを1つ入れてください。'}`;
    const messages=[{role:'user',parts:[{text:sysPrompt}]},{role:'model',parts:[{text:'承知しました。このケースについて議論しましょう。'}]}];
    chatHist.forEach(m=>{messages.push({role:m.role==='user'?'user':'model',parts:[{text:m.content}]});});
    const controller=new AbortController();
    const tid=setTimeout(()=>controller.abort(),30000);
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_INFO[activeModel||gemModel].api}:generateContent?key=${gemKey}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:messages,generationConfig:{maxOutputTokens:16000,temperature:0.7}}),
      signal:controller.signal
    });
    clearTimeout(tid);
    const data=await res.json();
    if(data.candidates&&data.candidates[0]){
      const text=data.candidates[0].content.parts.map(p=>p.text||'').join('');
      chatHist.push({role:'model',content:text});
      const inChars=JSON.stringify(messages).length;
      const outChars=text.length;
      addCost(estCostFromChars(inChars,outChars,activeModel||gemModel));
    }else{
      chatTurns--;chatHist.pop();chatHist.push({role:'model',content:'⚠️ APIエラー: '+(data.error?.message||'応答を取得できませんでした')+'（ターン消費なし。再送信してください）'});
    }
  }catch(e){
    chatTurns--;chatHist.pop();chatHist.push({role:'model',content:'⚠️ '+(e.name==='AbortError'?'タイムアウト（30秒）':'エラー: '+e.message)+'（ターン消費なし。再送信してください）'});
  }finally{
    chatLoading=false;
    try{if(chatTurns>=chatMaxTurns){const _ss=saveSparringSession();if(_ss)generateReviewCard(_ss.id);}}catch(se){console.error('save error:',se);}
    render();
    setTimeout(()=>{const ci=document.getElementById('chatInput');if(ci)ci.focus();},100);
  }
})();}

  const diffs=['初級','中級','上級'];
  
  // Calculate stats per FW
  const fwStats=fws.map((fw,i)=>{
    const qs=CASES.filter(c=>c.framework===fw);
    const answered=qs.filter(c=>answerHistory[c.id]);
    const correct=qs.filter(c=>answerHistory[c.id]==='correct');
    return{name:fwShort[i],fullName:fw,total:qs.length,answered:answered.length,correct:correct.length,rate:answered.length>0?Math.round(correct.length/answered.length*100):null};
  });
  
  // Calculate stats per difficulty
  const diffStats=diffs.map(d=>{
    const qs=CASES.filter(c=>c.difficulty===d);
    const answered=qs.filter(c=>answerHistory[c.id]);
    const correct=qs.filter(c=>answerHistory[c.id]==='correct');
    return{name:d,total:qs.length,answered:answered.length,correct:correct.length,rate:answered.length>0?Math.round(correct.length/answered.length*100):null};
  });
  
  // Overall stats
  const totalAnswered=Object.keys(answerHistory).length;
  const totalCorrect=Object.values(answerHistory).filter(v=>v==='correct').length;
  const overallRate=totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0;
  
  // Radar chart SVG
  const cx=150,cy=150,r=110;
  const n=fwStats.length;
  const points=fwStats.map((fw,i)=>{
    const angle=(Math.PI*2*i/n)-Math.PI/2;
    const val=fw.rate!==null?fw.rate/100:0;
    return{x:cx+r*val*Math.cos(angle),y:cy+r*val*Math.sin(angle),lx:cx+(r+25)*Math.cos(angle),ly:cy+(r+25)*Math.sin(angle),name:fw.name,rate:fw.rate};
  });
  
  const gridLines=[0.25,0.5,0.75,1.0].map(scale=>{
    const pts=Array.from({length:n},(_, i)=>{
      const angle=(Math.PI*2*i/n)-Math.PI/2;
      return`${cx+r*scale*Math.cos(angle)},${cy+r*scale*Math.sin(angle)}`;
    });
    return`<polygon points="${pts.join(' ')}" fill="none" stroke="#2a2a28" stroke-width="0.5"/>`;
  }).join('');
  
  const axisLines=Array.from({length:n},(_,i)=>{
    const angle=(Math.PI*2*i/n)-Math.PI/2;
    return`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(angle)}" y2="${cy+r*Math.sin(angle)}" stroke="#2a2a28" stroke-width="0.5"/>`;
  }).join('');
  
  const dataPolygon=points.filter(p=>p.rate!==null).length>=3?
    `<polygon points="${points.map(p=>p.rate!==null?`${p.x},${p.y}`:`${cx},${cy}`).join(' ')}" fill="rgba(91,143,185,0.25)" stroke="#5b8fb9" stroke-width="2"/>`:
    '';
  
  const dataDots=points.filter(p=>p.rate!==null).map(p=>
    `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#5b8fb9"/>`
  ).join('');
  
  const labels=points.map(p=>
    `<text x="${p.lx}" y="${p.ly}" text-anchor="middle" dominant-baseline="middle" fill="${p.rate!==null?'#e8e4d9':'#4a4840'}" font-size="9" font-weight="600">${p.name}${p.rate!==null?' '+p.rate+'%':''}</text>`
  ).join('');
  
  const radar=`<svg viewBox="0 0 300 300" style="width:100%;max-width:300px;margin:0 auto;display:block">
    ${gridLines}${axisLines}${dataPolygon}${dataDots}${labels}
    <text x="${cx}" y="${cy-5}" text-anchor="middle" fill="#e8e4d9" font-size="20" font-weight="900">${overallRate}%</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#6b6860" font-size="9">総合正答率</text>
  </svg>`;
  
  // FW detail table
  const fwRows=fwStats.map(fw=>{
    const bar=fw.rate!==null?`<div style="background:#1a1a18;border-radius:4px;height:8px;width:100%"><div style="background:${fw.rate>=70?'#4a9e6e':fw.rate>=40?'#d4a853':'#c4554e'};width:${fw.rate}%;height:100%;border-radius:4px"></div></div>`:'<div style="color:#4a4840;font-size:10px">未回答</div>';
    return`<div style="display:grid;grid-template-columns:70px 1fr 45px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1a1a18">
      <div style="font-size:11px;font-weight:600;color:#a09d93">${fw.name}</div>
      ${bar}
      <div style="font-size:12px;font-weight:700;color:${fw.rate!==null?(fw.rate>=70?'#4a9e6e':fw.rate>=40?'#d4a853':'#c4554e'):'#4a4840'};text-align:right">${fw.rate!==null?fw.rate+'%':'-'}</div>
    </div>`;
  }).join('');
  
  // Difficulty stats
  const diffRows=diffStats.map(d=>{
    const emoji=d.name==='初級'?'🟢':d.name==='中級'?'🟡':'🔴';
    return`<div style="text-align:center;padding:12px;background:#0f0f0e;border-radius:10px">
      <div style="font-size:11px;color:#6b6860">${emoji} ${d.name}</div>
      <div style="font-size:22px;font-weight:900;color:${d.rate!==null?(d.rate>=70?'#4a9e6e':d.rate>=40?'#d4a853':'#c4554e'):'#4a4840'};margin:4px 0">${d.rate!==null?d.rate+'%':'-'}</div>
      <div style="font-size:9px;color:#4a4840">${d.answered}/${d.total}問</div>
    </div>`;
  }).join('');
  
  return`<div class="ctn fade-in">
    ${rBackBtn()}
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:16px;font-weight:800;color:#e8e4d9">📊 ダッシュボード</div>
      <div style="font-size:11px;color:#6b6860;margin-top:4px">${totalAnswered}問回答 / ${CASES.length}問</div>
    </div>
    ${radar}
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0">${diffRows}</div>
    <div style="margin-top:16px;padding:16px;background:#0f0f0e;border-radius:12px">
      <div style="font-size:12px;font-weight:700;color:#a09d93;margin-bottom:8px">フレームワーク別</div>
      ${fwRows}
    </div>
  </div>`;
}

function exportCases(){
  const blob=new Blob([JSON.stringify(CASES,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='stgym_cases_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
}

function importCases(input){
  const file=input.files[0];
  if(!file)return;
  const status=document.getElementById('importStatus');
  status.textContent='読み込み中...';status.style.color='#d4a853';
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)){throw new Error('配列形式ではありません');}
      if(data.length===0){throw new Error('問題が0件です');}
      const sample=data[0];
      if(!sample.id||!sample.options||!sample.bestAnswer){throw new Error('問題データの形式が不正です');}
      if(!confirm(data.length+'問のデータをインポートします。現在の'+CASES.length+'問は上書きされます。よろしいですか？'))return;
      CASES=data;
      // Save to cache via fetch replacement
      const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
      caches.open('stgym-v42').then(cache=>{
        cache.put(new Request('./cases.json'),new Response(blob));
      });
      status.textContent='✓ '+data.length+'問をインポートしました';status.style.color='#4a9e6e';
      setTimeout(()=>render(),1500);
    }catch(err){
      status.textContent='✗ エラー: '+err.message;status.style.color='#c4554e';
    }
  };
  reader.readAsText(file);
  input.value='';
}

function exportHistory(){
  const blob=new Blob([JSON.stringify(answerHistory,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='stgym_history_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
}

function importHistory(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(typeof data!=='object'){throw new Error('形式が不正です');}
      const count=Object.keys(data).length;
      if(!confirm(count+'件の回答履歴をインポートします。現在の履歴とマージされます。'))return;
      Object.assign(answerHistory,data);
      try{localStorage.setItem('answer_history',JSON.stringify(answerHistory));}catch(ex){}
      alert('✓ '+count+'件の履歴をインポートしました');
      render();
    }catch(err){alert('エラー: '+err.message);}
  };
  reader.readAsText(file);
  input.value='';
}

  const prompt='あなたは事業戦略クイズの問題作成の専門家です。以下の絶対ルールを厳守し4択問題を1問作成してください。\n\n'
    +'【業種・企業】'+industry+'\n【フレームワーク】'+fw+'\n【難易度】'+diff+'\n\n'
    +'■ 選択肢label（最重要）\n'
    +'- 全4選択肢のlabelを15〜40文字で揃えること\n'
    +'- 正答だけが長い/詳しいのは絶対禁止\n'
    +'- FW用語の接頭辞（SO:,WO:,Product:,PLG:等）は絶対禁止\n'
    +'- テンプレ表現（この方向性で〜、経営資源を集中〜）は禁止\n'
    +'- 助詞で文が終わってはならない\n'
    +'- '+(_fwGuide[fw]||'')+'\n\n'
    +'■ description: 各選択肢に20文字以上の詳細説明\n'
    +'■ situation: 100〜200文字で具体的数値を含める\n'
    +'■ explanation: bestAnswerが最適な理由＋他3つがなぜ不適切かを説明\n'
    +'■ 難易度: '+_diffGuide+'\n'
    +'■ bestAnswer: a/b/c/dからランダムに選ぶ\n\n'
    +'以下のJSONのみ出力。JSON以外は一切出力しないこと。\n'
    +'{"industry":"業種名","situation":"状況文","question":"設問文","options":[{"id":"a","label":"選択肢A","description":"詳細A"},{"id":"b","label":"選択肢B","description":"詳細B"},{"id":"c","label":"選択肢C","description":"詳細C"},{"id":"d","label":"選択肢D","description":"詳細D"}],"bestAnswer":"正答id","explanation":"解説文","keyFramework":"FW適用ポイント","realExample":"実在企業の類似事例"}';

  try{
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL_INFO.pro31.api+':generateContent?key='+gemKey,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:8192,temperature:0.7}})
    });
    const data=await res.json();
    if(!data.candidates||!data.candidates[0]){throw new Error(data.error?.message||'応答なし');}
    
    var text=data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    text=text.replace(/```json|```/g,'').trim();
    clearInterval(pgTimer);
    // JSON修復: 途切れている場合の補完
    if(!text.endsWith('}')){
      var lastBrace=text.lastIndexOf('}');
      if(lastBrace>0) text=text.substring(0,lastBrace+1);
      // 未閉じの文字列を閉じる
      var openQuotes=(text.match(/"/g)||[]).length;
      if(openQuotes%2!==0) text+='"';
      // 未閉じの配列・オブジェクトを閉じる
      var opens=0,closes=0;
      for(var ci=0;ci<text.length;ci++){if(text[ci]==='{')opens++;if(text[ci]==='}')closes++;}
      while(closes<opens){text+='}';closes++;}
    }
    var q;
    try{q=JSON.parse(text);}catch(pe){throw new Error('JSON解析エラー。再生成してください: '+pe.message.substring(0,50));}
    
    q.id=CASES.length>0?Math.max.apply(null,CASES.map(function(c){return c.id;}))+1:1;
    q.difficulty=diff;
    q.framework=fw;
    
    var qcErrors=[];
    if(!q.options||q.options.length!==4) qcErrors.push('選択肢が4つありません');
    if(!q.bestAnswer||['a','b','c','d'].indexOf(q.bestAnswer)<0) qcErrors.push('bestAnswerが不正');
    if(!q.situation||q.situation.length<30) qcErrors.push('状況文が短すぎます');
    if(!q.question||q.question.length<5) qcErrors.push('設問文がありません');
    if(!q.explanation||q.explanation.length<30) qcErrors.push('解説が短すぎます');
    
    if(q.options&&q.options.length===4){
      var optIds=q.options.map(function(o){return o.id;}).sort().join('');
      if(optIds!=='abcd') qcErrors.push('選択肢IDがa/b/c/dではありません');
      if(!q.options.find(function(o){return o.id===q.bestAnswer;})) qcErrors.push('bestAnswerが選択肢に存在しません');
      var bestL=q.options.find(function(o){return o.id===q.bestAnswer;});
      var othL=q.options.filter(function(o){return o.id!==q.bestAnswer;});
      if(bestL&&othL.length===3){
        var bLen=bestL.label.length;var aOth=othL.reduce(function(s,o){return s+o.label.length;},0)/3;
        if(aOth>0&&bLen/aOth>=2.0) qcErrors.push('正答labelが不正解の'+Math.round(bLen/aOth*10)/10+'倍長い');
      }
      q.options.forEach(function(o){
        if(o.label.length>=5&&'をでにのとはがしてりめけさせ'.indexOf(o.label[o.label.length-1])>=0) qcErrors.push(o.id.toUpperCase()+' 途切れ');
        if(o.label.length<8) qcErrors.push(o.id.toUpperCase()+' 短すぎ('+o.label.length+'文字)');
        if(!o.description||o.description.length<5) qcErrors.push(o.id.toUpperCase()+' description不足');
      });
    }
    
    var checkHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:10px">📋 品質チェック</div>';
    if(qcErrors.length>0){
      qcErrors.forEach(function(e){checkHtml+='<div style="font-size:11px;color:#c4554e;padding:3px 0">❌ '+e+'</div>';});
    }else{
      checkHtml+='<div style="font-size:11px;color:#4a9e6e">✅ 全チェック合格</div>';
    }
    checkHtml+='</div>';
    
    var previewHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#4a9e6e;margin-bottom:10px">✓ 問題プレビュー</div>'
      +'<div style="font-size:11px;color:#6b6860;margin-bottom:4px">'+q.industry+' / '+q.framework+' / '+q.difficulty+'</div>'
      +'<div style="font-size:13px;color:#e8e4d9;margin-bottom:10px;line-height:1.6">'+q.situation+'</div>'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:8px">'+q.question+'</div>'
      +q.options.map(function(o){return'<div style="padding:8px 10px;margin:4px 0;border-radius:6px;font-size:12px;'+(o.id===q.bestAnswer?'background:#1a2a1a;border:1px solid #4a9e6e;color:#4a9e6e':'background:#1a1a18;color:#a09d93')+'">'
        +o.id.toUpperCase()+': '+o.label+(o.id===q.bestAnswer?' ✓':'')+'</div>';}).join('')
      +'<div style="margin-top:8px;font-size:11px;color:#6b6860;line-height:1.5">'+(q.explanation||'').substring(0,200)+'...</div></div>';
    
    var aiReviewHtml='<div style="background:#0f0f0e;border-radius:12px;padding:16px;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:700;color:#e8e4d9;margin-bottom:8px">🤖 AI品質レビュー</div>'
      +'<button onclick="runAiReview()" class="btn" style="background:#3a3a38;color:#e8e4d9;padding:10px;font-size:12px">◆ 3.1 Pro でレビュー実行</button>'
      +'<div id="aiReviewResult" style="margin-top:8px"></div></div>';
    
    var actHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
      +(qcErrors.length===0?'<button onclick="addGeneratedQuestion()" class="btn" style="background:#4a9e6e;color:#fff;padding:12px;font-size:13px">✓ 追加する</button>':'<button disabled class="btn" style="background:#2a2a28;color:#4a4840;padding:12px;font-size:13px">❌ エラーあり</button>')
      +'<button onclick="screen=\'create_q\';render()" class="btn" style="background:#2a2a28;color:#e8e4d9;padding:12px;font-size:13px">✗ やり直す</button></div>';
    
    result.innerHTML=checkHtml+previewHtml+aiReviewHtml+actHtml;
    window._pendingQuestion=q;
    
  }catch(err){
    result.innerHTML='<div style="background:#2a1a1a;border-radius:10px;padding:14px;color:#c4554e;font-size:12px">⚠️ '+err.message+'</div>';
  }finally{
    clearInterval(pgTimer);btn.disabled=false;btn.textContent='🤖 3.1 Pro で問題を生成';
  }
}

function addGeneratedQuestion(){
  if(!window._pendingQuestion)return;
  CASES.push(window._pendingQuestion);
  // Update cache
  try{
    const blob=new Blob([JSON.stringify(CASES)],{type:'application/json'});
    caches.open('stgym-v42').then(cache=>{
      cache.put(new Request('./cases.json'),new Response(blob));
    });
  }catch(e){}
  alert('✓ 問題を追加しました（ID: '+window._pendingQuestion.id+'）\n合計: '+CASES.length+'問');
  window._pendingQuestion=null;
  screen='create_q';render();
}


async function runAiReview(){
  var q=window._pendingQuestion;
  if(!q||!gemKey)return;
  var sec=document.getElementById('aiReviewResult');
  sec.innerHTML='<div style="color:#d4a853;font-size:11px">🔄 AIレビュー中...</div>';
  
  var reviewPrompt='以下の事業戦略4択問題を品質レビューしてください。\n\n'
    +'【問題データ】\n'+JSON.stringify(q,null,2)+'\n\n'
    +'以下の5項目を評価し、JSON形式で回答してください。JSON以外は一切出力しないでください。\n'
    +'{\n'
    +'"difficulty_ok": true/false, // 指定難易度（'+q.difficulty+'）に適切か\n'
    +'"difficulty_comment": "難易度の評価コメント",\n'
    +'"options_balanced": true/false, // 4つの選択肢のもっともらしさは均等か\n'
    +'"options_comment": "選択肢バランスの評価",\n'
    +'"answer_correct": true/false, // bestAnswerは本当に最適解か\n'
    +'"answer_comment": "正答の妥当性コメント",\n'
    +'"explanation_ok": true/false, // 解説は正答を適切に説明しているか\n'
    +'"explanation_comment": "解説の評価",\n'
    +'"overall_score": 1-5, // 総合スコア（5が最高）\n'
    +'"overall_comment": "総合コメント",\n'
    +'"suggested_fixes": ["修正提案1","修正提案2"] // 改善点（なければ空配列）\n'
    +'}';
  
  try{
    var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODEL_INFO.pro31.api+':generateContent?key='+gemKey,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:reviewPrompt}]}],generationConfig:{maxOutputTokens:2000,temperature:0.3}})
    });
    var data=await res.json();
    if(!data.candidates||!data.candidates[0])throw new Error(data.error?.message||'応答なし');
    
    var text=data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('');
    text=text.replace(/```json|```/g,'').trim();
    var review=JSON.parse(text);
    
    var items=[
      {key:'difficulty_ok',label:'難易度',comment:review.difficulty_comment},
      {key:'options_balanced',label:'選択肢バランス',comment:review.options_comment},
      {key:'answer_correct',label:'正答の妥当性',comment:review.answer_comment},
      {key:'explanation_ok',label:'解説品質',comment:review.explanation_comment}
    ];
    
    var stars='';
    for(var i=0;i<5;i++){stars+=(i<(review.overall_score||0))?'★':'☆';}
    
    var rhtml='<div style="margin-top:8px">';
    items.forEach(function(item){
      var ok=review[item.key];
      rhtml+='<div style="font-size:11px;padding:4px 0;color:'+(ok?'#4a9e6e':'#c4554e')+'">'+(ok?'✅':'❌')+' '+item.label+': '+item.comment+'</div>';
    });
    rhtml+='<div style="margin-top:8px;font-size:13px;color:#d4a853">'+stars+' ('+review.overall_score+'/5)</div>';
    rhtml+='<div style="font-size:11px;color:#a09d93;margin-top:4px">'+review.overall_comment+'</div>';
    
    if(review.suggested_fixes&&review.suggested_fixes.length>0){
      rhtml+='<div style="margin-top:8px;font-size:11px;color:#d4a853">💡 改善提案:</div>';
      review.suggested_fixes.forEach(function(fix){rhtml+='<div style="font-size:10px;color:#8b8880;padding:2px 0">・'+fix+'</div>';});
    }
    rhtml+='</div>';
    sec.innerHTML=rhtml;
    
  }catch(err){
    sec.innerHTML='<div style="color:#c4554e;font-size:11px">⚠️ レビューエラー: '+err.message+'</div>';
  }
}

function saveSparringSession(){
  if(!chatHist.length)return;
  const c=quiz[idx];
  const session={
    id:Date.now(),
    date:new Date().toISOString(),
    case_id:c.id,
    industry:c.industry,
    framework:c.framework,
    difficulty:c.difficulty,
    question:c.question,
    situation:c.situation.substring(0,100)+'...',
    history:chatHist,
    turns:chatTurns,
    model:gemModel
  };
  let sessions=[];
  try{sessions=JSON.parse(localStorage.getItem('sparring_sessions')||'[]');}catch(e){}
  sessions.unshift(session);
  if(sessions.length>50)sessions=sessions.slice(0,50);
  try{localStorage.setItem('sparring_sessions',JSON.stringify(sessions));}catch(e){}
  return session;
}

async function generateReviewCard(sessionId){
  if(!gemKey)return;
  const sessions=getSparringSessions();
  const s=sessions.find(x=>x.id===sessionId);
  if(!s||s.reviewCard)return;
  const activeModel=(s.difficulty==='初級')?'flash':(s.model||'flash');
  const chatLog=s.history.map(m=>(m.role==='user'?'ユーザー：':'AI：')+m.content).join('\n');
  const prompt=`以下の壁打ち（戦略議論）のログを分析し、必ず以下の4項目だけをJSON形式で返してください。他の文字は一切不要です。

{"summary":"議論内容の1行要約（30文字以内）","strength":"ユーザーの戦略的思考の強み（40文字以内）","improvement":"改善ポイント（40文字以内）","weaknessPattern":"改善ポイントを抽象化した思考パターン。特定のFWに依存しない上位概念で表現（例：外部脅威の想定力が弱い、定量的な検証が不足、時間軸の考慮が甘い等）（30文字以内）"}

【ケース】${s.industry} / ${s.framework}
【問い】${s.question}
【議論ログ】
${chatLog}`;
  try{
    const controller=new AbortController();
    const tid=setTimeout(()=>controller.abort(),20000);
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_INFO[activeModel].api}:generateContent?key=${gemKey}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:500,temperature:0.3}}),
      signal:controller.signal
    });
    clearTimeout(tid);
    const data=await res.json();
    if(data.candidates&&data.candidates[0]){
      let text=data.candidates[0].content.parts.map(p=>p.text||'').join('').trim();
      text=text.replace(/```json|```/g,'').trim();
      try{
        const card=JSON.parse(text);
        if(card.summary&&card.strength&&card.improvement){if(!card.weaknessPattern)card.weaknessPattern=card.improvement;
          s.reviewCard=card;
          try{localStorage.setItem('sparring_sessions',JSON.stringify(sessions));}catch(e){}
          if(screen==='sparring_history'||screen==='sparring_view')render();
        }
      }catch(pe){
        s.reviewCard={summary:text.substring(0,50),strength:'（解析中）',improvement:'（解析中）'};
        try{localStorage.setItem('sparring_sessions',JSON.stringify(sessions));}catch(e){}
      }
    }
  }catch(e){console.log('Review card generation failed:',e);}
}

function getTopWeaknessPattern(){
  const sessions=getSparringSessions();
  const patterns={};
  sessions.forEach(s=>{
    if(s.reviewCard&&s.reviewCard.weaknessPattern){
      const p=s.reviewCard.weaknessPattern;
      patterns[p]=(patterns[p]||0)+1;
    }
  });
  const sorted=Object.entries(patterns).sort((a,b)=>b[1]-a[1]);
  if(sorted.length===0)return null;
  return {pattern:sorted[0][0],count:sorted[0][1],total:sessions.filter(s=>s.reviewCard).length};
}

// === Cloud Sync (Firebase Realtime Database) ===
let syncUrl='',syncId='';
try{syncUrl=localStorage.getItem('sync_url')||'';}catch(e){}
try{syncId=localStorage.getItem('sync_id')||'';}catch(e){}
let syncStatus='disconnected'; // disconnected | syncing | synced | error
let syncTimer=null;
let lastSyncTime=0;

function isSyncEnabled(){return syncUrl&&syncId;}

async function pushToCloud(){
  if(!isSyncEnabled())return;
  syncStatus='syncing';updateSyncBadge();
  const data={
    h:answerHistory,
    m:gemModel,
    k:gemKey,
    c:{},
    t:Date.now()
  };
  for(let i=0;i<12;i++){const d=new Date();d.setMonth(d.getMonth()-i);const key='monthly_cost_'+d.toISOString().slice(0,7);try{const v=localStorage.getItem(key);if(v)data.c[key]=v;}catch(e){}}
  try{
    const url=syncUrl.replace(/\/$/,'')+'/'+encodeURIComponent(syncId)+'.json';
    const res=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(res.ok){syncStatus='synced';lastSyncTime=Date.now();}
    else{syncStatus='error';}
  }catch(e){syncStatus='error';}
  updateSyncBadge();
}

async function pullFromCloud(){
  if(!isSyncEnabled()||_clearing)return;
  syncStatus='syncing';updateSyncBadge();
  try{
    const url=syncUrl.replace(/\/$/,'')+'/'+encodeURIComponent(syncId)+'.json';
    const res=await fetch(url);
    if(!res.ok){syncStatus='error';updateSyncBadge();return;}
    const data=await res.json();
    if(!data||!data.h){syncStatus='synced';updateSyncBadge();return;}
    // Smart merge: keep newer data (by timestamp)
    const localKeys=Object.keys(answerHistory).length;
    const remoteKeys=Object.keys(data.h).length;
    // Merge: union of both (both are correct/wrong, no conflict)
    let changed=false;
    if(_clearing)return;
    Object.entries(data.h).forEach(([k,v])=>{
      if(!answerHistory[k]){answerHistory[k]=v;changed=true;}
    });
    if(changed){
      try{localStorage.setItem('answer_history',JSON.stringify(answerHistory));}catch(e){}
    }
    if(data.k&&!gemKey){gemKey=data.k;try{localStorage.setItem('gemini_key',gemKey);}catch(e){}}
    if(data.m&&data.m!==gemModel){gemModel=data.m;try{localStorage.setItem('gemini_model',gemModel);}catch(e){}}
    if(data.c){Object.entries(data.c).forEach(([k,v])=>{try{localStorage.setItem(k,v);}catch(e){}});}
    syncStatus='synced';lastSyncTime=Date.now();
    if(changed&&screen==='start')render();
  }catch(e){syncStatus='error';}
  updateSyncBadge();
}

function schedulePush(){
  if(_clearing)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>pushToCloud(),2000); // debounce 2s
}

// Override saveAnswer to trigger sync
const _origSaveAnswer=saveAnswer;
saveAnswer=function(id,correct){
  _origSaveAnswer(id,correct);
  schedulePush();
};

function updateSyncBadge(){
  const el=document.getElementById('syncBadge');
  if(!el)return;
  const icons={disconnected:'⚫',syncing:'🔄',synced:'🟢',error:'🔴'};
  const labels={disconnected:'未接続',syncing:'同期中...',synced:'同期済み',error:'エラー'};
  el.textContent=icons[syncStatus]+' '+labels[syncStatus];
  el.style.color=syncStatus==='synced'?'#4a9e6e':syncStatus==='error'?'#c4554e':'#6b6860';
}

function saveSyncSettings(url,id){
  syncUrl=url;syncId=id;
  try{localStorage.setItem('sync_url',url);localStorage.setItem('sync_id',id);}catch(e){}
  if(isSyncEnabled()){
    pullFromCloud().then(()=>pushToCloud());
  }else{
    syncStatus='disconnected';updateSyncBadge();
  }
  render();
}

// Manual export/import as fallback
function doExport(){
  const data={h:answerHistory,m:gemModel,k:gemKey,c:{},t:Date.now()};
  for(let i=0;i<12;i++){const d=new Date();d.setMonth(d.getMonth()-i);const key='monthly_cost_'+d.toISOString().slice(0,7);try{const v=localStorage.getItem(key);if(v)data.c[key]=v;}catch(e){}}
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  navigator.clipboard.writeText(code).then(()=>{
    alert('同期コードをコピーしました（'+Object.keys(data.h).length+'問分）\n\n別端末の「インポート」に貼り付けてください');
  }).catch(()=>{prompt('コピーしてください：',code);});
}
function doImport(){
  const code=prompt('同期コードを貼り付け：');
  if(!code)return;
  try{
    const data=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!data.h){alert('無効なコードです');return;}
    const merged={...answerHistory,...data.h};
    if(!confirm('インポート（統合後 '+Object.keys(merged).length+'問）を実行？'))return;
    answerHistory=merged;
    try{localStorage.setItem('answer_history',JSON.stringify(answerHistory));}catch(e){}
    if(data.k&&!gemKey){gemKey=data.k;try{localStorage.setItem('gemini_key',gemKey);}catch(e){}}
    if(data.m){gemModel=data.m;try{localStorage.setItem('gemini_model',gemModel);}catch(e){}}
    alert('完了！');if(isSyncEnabled())pushToCloud();render();
  }catch(e){alert('無効なコードです');}
}
